:root{
  --bg:#F7F5EF;--panel:#FFFFFF;--panel2:#EEF3EF;--ink:#26302B;--muted:#6B746F;--line:#E2DED4;
  --acc:#3E6B57;--acc-ink:#FFFFFF;--acc-soft:#E3EEE8;
  --good:#2F7A4E;--good-bg:#E3F2E7;--bad:#B42318;--bad-bg:#FDE2E1;--warn:#9A6414;--warn-bg:#FCEFD6;
  --g-Income:#3E6B57;--g-Bills:#4F6D8A;--g-Needs:#A87F2D;--g-Wants:#B5654A;--g-Savings:#5E8C7A;--g-Debt:#7A5C8C;
  --shadow:0 1px 2px rgba(30,40,35,.06),0 6px 20px rgba(30,40,35,.06);
  --r:18px;--serif:'Instrument Serif',Georgia,serif;--sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
:root[data-accent=slate]{--acc:#4F6D8A;--acc-soft:#E3EAF2}
:root[data-accent=terra]{--acc:#B5654A;--acc-soft:#F6E5DE}
:root[data-accent=plum]{--acc:#7A5C8C;--acc-soft:#ECE4F1}
:root[data-theme=dark]{
  --bg:#171C1A;--panel:#212825;--panel2:#29312D;--ink:#ECEFEA;--muted:#9AA59F;--line:#333D38;
  --acc:#8DC0A6;--acc-ink:#14201A;--acc-soft:#26372F;
  --good:#8DC0A6;--good-bg:#21352B;--bad:#F09A8A;--bad-bg:#43272A;--warn:#E8BE6A;--warn-bg:#3F3420;
  --g-Income:#8DC0A6;--g-Bills:#8FB0CF;--g-Needs:#D9B064;--g-Wants:#DE9A7E;--g-Savings:#79B8A0;--g-Debt:#B595C9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark;
}
:root[data-theme=dark][data-accent=slate]{--acc:#8FB0CF;--acc-soft:#25313D}
:root[data-theme=dark][data-accent=terra]{--acc:#DE9A7E;--acc-soft:#3D2C25}
:root[data-theme=dark][data-accent=plum]{--acc:#B595C9;--acc-soft:#33293B}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
h1,h2,h3{margin:0;font-weight:400}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
body.hide .amt{filter:blur(7px);user-select:none}

/* layout */
.shell{max-width:1180px;margin:0 auto;display:flex;gap:28px;padding:0 16px}
.side{display:none}
main{flex:1;min-width:0;padding-top:8px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;margin:0 -16px 6px;display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--serif);font-size:1.9rem;line-height:1.1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:1.05rem;flex:none}
.iconbtn svg{width:20px;height:20px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin:0 0 14px}
.monthbar button{border:0;background:transparent;width:40px;height:36px;border-radius:999px;font-size:1.2rem;color:var(--muted)}
.monthbar button:hover{background:var(--panel2)}
.monthbar b{font-weight:800}
.monthbar .today{font-size:.78rem;width:auto;padding:0 12px;color:var(--acc);font-weight:800}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-family:var(--serif);font-size:1.45rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.card h2 .btn,.card h2 .ci-btn,.card h2 .pill{font-family:var(--sans)}
.card h2 .link{font-family:var(--sans);font-size:.85rem;font-weight:800;color:var(--acc);background:none;border:0;padding:4px 2px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
.grid2>.card{margin-bottom:0}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.empty .big{font-size:2rem;display:block;margin-bottom:6px}

/* hero */
.hero{background:var(--acc);color:var(--acc-ink);border:0;position:relative;overflow:hidden}
.hero .lab{font-weight:800;opacity:.9;font-size:.95rem}
.hero .big{font-weight:900;font-size:clamp(2.6rem,11vw,3.6rem);line-height:1.05;letter-spacing:-.02em;margin:2px 0 4px}
.hero .sub{opacity:.92;font-size:.95rem}
.hero .neg{color:#FFE1DA}
:root[data-theme=dark] .hero .neg{color:#7A1E14}
.hero .how{background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:800;margin-top:10px}
:root[data-theme=dark] .hero .how{background:rgba(0,0,0,.14)}
.hero .ring{position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(255,255,255,.09)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
:root[data-theme=dark] .tile{background:rgba(0,0,0,.12)}
.tile .t{font-size:.76rem;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-weight:900;font-size:1.12rem}
.breakdown{margin-top:10px;font-size:.9rem;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;display:none}
.breakdown.on{display:block}
.breakdown div{display:flex;justify-content:space-between;padding:2px 0}
.breakdown .tot{border-top:1px solid rgba(255,255,255,.35);margin-top:4px;padding-top:6px;font-weight:900}

/* lists */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.vstack{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.li.tap{cursor:pointer;border-radius:10px}
.li.tap:hover{background:var(--panel2)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;flex:none;background:var(--panel2)}
.li .name{font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .val{font-weight:900;text-align:right;white-space:nowrap}
.dayhead{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 2px}
.pill{display:inline-block;font-size:.72rem;font-weight:900;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st-paid{background:var(--good-bg);color:var(--good)}
.st-overdue{background:var(--bad-bg);color:var(--bad)}
.st-soon{background:var(--warn-bg);color:var(--warn)}
.st-upcoming{background:var(--panel2);color:var(--muted)}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none;font-weight:900;color:transparent}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
:root[data-theme=dark] .check.on{color:#14201A}

/* bars */
.bar{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--good)}
.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}.bar.muted>i{background:var(--muted)}
.gbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--panel2);margin:6px 0 10px}
.gbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* check-in */
.checkin .li{padding:8px 2px}
.ci-btn{border:0;background:var(--acc-soft);color:var(--acc);font-weight:900;border-radius:999px;padding:8px 14px;font-size:.85rem;white-space:nowrap}
.banner{border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner .ttl{font-weight:900}
.banner.info{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 25%,transparent)}
.banner .x{margin-left:auto;border:0;background:none;font-size:1.2rem;color:var(--muted);padding:0 4px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.demo{background:#26302B;color:#F7F5EF;text-align:center;padding:8px 14px;font-size:.85rem;font-weight:800}
.demo a{color:#D9B064}

/* buttons + forms */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;background:var(--acc);color:var(--acc-ink);min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.alt{background:var(--panel2);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:8px 14px;border-radius:12px;font-size:.9rem}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-weight:800;font-size:.88rem;margin-bottom:5px}
label.f>small{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 13px;min-height:48px;font-size:16px}

let S = blankState();

/* ---------------------------------------------------------------- weeks */
const weekStartOf = (d, ws = S.settings.weekStart) => addDays(d, -((parseISO(d).getDay() - ws + 7) % 7));
const weekDays = start => Array.from({ length: 7 }, (_, i) => addDays(start, i));
const areaColor = a => { const i = S.settings.areas.indexOf(a); return AREA_COLORS[(i < 0 ? 0 : i) % AREA_COLORS.length]; };

/* ---------------------------------------------------------------- tasks */
const findTask = id => S.tasks.find(t => t.id === id);
const byOrder = (a, b) => (a.when || '9999') < (b.when || '9999') ? -1 : (a.when || '9999') > (b.when || '9999') ? 1 : (a.order || 0) - (b.order || 0) || (a.created < b.created ? -1 : 1);
const openTasks = () => S.tasks.filter(t => !t.done);
/* Everything on today's plate: today's tasks plus anything carried over from earlier days. */
const todayTasks = () => { const d = todayISO(); return openTasks().filter(t => t.when && t.when <= d).sort(byOrder); };
const carriedTasks = () => { const d = todayISO(); return openTasks().filter(t => t.when && t.when < d).sort(byOrder); };
const tasksOn = d => S.tasks.filter(t => t.when === d && !t.done).sort(byOrder);
const doneOn = d => S.tasks.filter(t => t.done === d);
const somedayTasks = () => openTasks().filter(t => !t.when).sort(byOrder);
const upcomingTasks = () => { const d = todayISO(); return openTasks().filter(t => t.when && t.when > d).sort(byOrder); };
const topToday = () => { const d = todayISO(); return S.tasks.filter(t => t.top === d && (!t.done || t.done === d)).sort(byOrder); };
function newTask(o) {
  return Object.assign({ id: uid(), title: '', when: todayISO(), energy: 'med', mins: 15, area: '', repeat: '', notes: '', steps: [], goal: null,
    top: null, done: null, created: todayISO(), order: Date.now() }, o);
}
function stepDate(d, rep, anchorDay) {
  if (rep === 'daily') return addDays(d, 1);
  if (rep === 'weekly') return addDays(d, 7);
  if (rep === 'weekdays') { let n = addDays(d, 1); while ([0, 6].includes(parseISO(n).getDay())) n = addDays(n, 1); return n; }
  if (rep === 'monthly') { const dt = parseISO(d); let y = dt.getFullYear(), m = dt.getMonth() + 2; if (m > 12) { m = 1; y++; } return iso(y, m, Math.min(anchorDay || dt.getDate(), daysIn(y, m))); }
  return null;
}
/* Next date for a repeating task: step from its date until it's after today (a carried-over daily task comes back tomorrow). */
function nextRepeat(t) {
  if (!t.repeat || !t.when) return null;
  const anchor = t.rday || parseISO(t.when).getDate(), today = todayISO();
  let d = stepDate(t.when, t.repeat, anchor), guard = 0;
  while (d <= today && guard++ < 1000) d = stepDate(d, t.repeat, anchor);
  return d;
}
function completeTask(t, day = todayISO()) {
  if (t.done) return null;
  t.done = day;
  const nd = nextRepeat(t);
  if (!nd) return null;
  const n = newTask({ title: t.title, when: nd, energy: t.energy, mins: t.mins, area: t.area, repeat: t.repeat, notes: t.notes, goal: t.goal,
    rday: t.rday || parseISO(t.when).getDate(), steps: t.steps.map(s => ({ id: uid(), t: s.t, done: false })), order: t.order });
  S.tasks.push(n); t.next = n.id;
  return n;
}
/* Undo a completion. The repeat it created is removed only if nobody has touched it yet. */
function reopenTask(t) {
  t.done = null;
  const n = t.next && findTask(t.next);
  if (n && !n.done && n.steps.every(s => !s.done)) S.tasks = S.tasks.filter(x => x !== n);
  t.next = null;
}
function toggleTop(t) {
  const d = todayISO();
  if (t.top === d) { t.top = null; return true; }
  if (topToday().filter(x => !x.done).length >= 3) return false;
  t.top = d; if (!t.when || t.when > d) t.when = d;
  return true;
}
function moveToToday(list) { const d = todayISO(); for (const t of list) t.when = d; }
/* One suggestion at a time: Top 3 first, then tasks that fit today's energy, then (on low energy) the quickest. */
function nextUp(skip = []) {
  const d = todayISO(), e = S.days[d]?.energy, er = e ? ERANK[e] : 3;
  const pool = todayTasks().filter(t => !skip.includes(t.id));
  if (!pool.length) return null;
  const score = (t, i) => (t.top === d ? 0 : 10000) + (ERANK[t.energy || 'med'] > er ? 5000 : 0) + (er === 1 ? num(t.mins) * 10 : 0) + (t.when < d ? 1000 : 0) + i;
  return pool.map((t, i) => [score(t, i), t]).sort((a, b) => a[0] - b[0])[0][1];
}
const plannedMins = d => sum(tasksOn(d).concat(d === todayISO() ? carriedTasks() : []), t => t.mins);

/* ---------------------------------------------------------------- habits */
const habitOn = (h, d) => !!h.log[d];
const habitWeek = (h, ws) => weekDays(ws).filter(d => h.log[d]).length;
function habitStreak(h) {
  const t = todayISO();
  if (num(h.per) >= 7) {
    let d = h.log[t] ? t : addDays(t, -1), n = 0;
    while (h.log[d] && n < 3660) { n++; d = addDays(d, -1); }
    return { n, unit: 'day' };
  }
  let ws = weekStartOf(t), n = habitWeek(h, ws) >= h.per ? 1 : 0;
  for (let k = 1; k < 520; k++) { ws = addDays(ws, -7); if (habitWeek(h, ws) >= h.per) n++; else break; }
  return { n, unit: 'week' };
}
function toggleHabit(h, d = todayISO()) { if (h.log[d]) delete h.log[d]; else h.log[d] = 1; }

/* ---------------------------------------------------------------- routines */
const routineKey = (r, d = todayISO()) => r.freq === 'weekly' ? weekStartOf(d) : d;
function routineProgress(r, d = todayISO()) {
  const done = (r.log[routineKey(r, d)] || []).filter(id => r.steps.some(s => s.id === id)).length;
  return { done, total: r.steps.length, complete: r.steps.length > 0 && done >= r.steps.length };
}
const stepDone = (r, sid, d) => (r.log[routineKey(r, d)] || []).includes(sid);
function toggleStep(r, sid, d = todayISO()) {
  const k = routineKey(r, d), a = r.log[k] || (r.log[k] = []);
  const i = a.indexOf(sid); if (i >= 0) a.splice(i, 1); else a.push(sid);
}
function makeRoutine(key) {
  const [name, icon, freq, steps] = STARTER_ROUTINES[key];
  return { id: uid(), name, icon, freq, steps: steps.map(t => ({ id: uid(), t })), log: {} };
}

/* ---------------------------------------------------------------- focus + goals + week review */
const focusOn = d => sum(S.focus.filter(f => f.date === d), f => f.mins);
const focusWeek = ws => { const end = addDays(ws, 6); return sum(S.focus.filter(f => f.date >= ws && f.date <= end), f => f.mins); };
function goalInfo(g) {
  const ms = g.steps.length, msDone = g.steps.filter(s => s.done).length;
  const tasks = S.tasks.filter(t => t.goal === g.id), tDone = tasks.filter(t => t.done).length;
  const total = ms || tasks.length, done = ms ? msDone : tDone;
  return { ms, msDone, open: tasks.filter(t => !t.done).sort(byOrder), tDone, pct: total ? done / total : 0, complete: !!g.done || (ms > 0 && msDone >= ms),
    daysLeft: g.date ? diffDays(todayISO(), g.date) : null };
}
function weekReview(ws) {
  const days = weekDays(ws), end = days[6];
  const done = S.tasks.filter(t => t.done && t.done >= ws && t.done <= end).length;
  const hTarget = sum(S.habits.filter(h => !h.archived), h => Math.min(7, num(h.per) || 7));
  const hDone = sum(S.habits.filter(h => !h.archived), h => Math.min(habitWeek(h, ws), Math.min(7, num(h.per) || 7)));
  const routines = sum(S.routines, r => r.freq === 'weekly' ? (routineProgress(r, ws).complete ? 1 : 0) : days.filter(d => routineProgress(r, d).complete).length);
  return { done, focus: focusWeek(ws), hDone, hTarget, routines };
}

/* ---------------------------------------------------------------- export */
function tasksCSV() {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['Task', 'Date', 'Area', 'Energy', 'Minutes', 'Repeats', 'Done on', 'Steps', 'Notes']];
  for (const t of [...S.tasks].sort(byOrder))
    rows.push([t.title, t.when || 'Someday', t.area, ENERGY[t.energy]?.[0] || '', t.mins || '', REPEATS[t.repeat || ''], t.done || '',
      t.steps.map(s => (s.done ? '[x] ' : '[ ] ') + s.t).join(' | '), t.notes]);
  return rows.map(r => r.map(q).join(',')).join('\r\n');
}

  <nav class="sidenav" aria-label="Sections">${SIDE.map(r => `<button data-a="go" data-r="${r}" class="${UI.route === r ? 'on' : ''}">${svg(ROUTES[r][1])}${ROUTES[r][0]}${r === 'dump' && S.dump.length ? `<span class="cnt">${S.dump.length}</span>` : ''}</button>`).join('')}</nav>`;
}
function bottomNav() {
  const b = (r, label) => `<button data-a="go" data-r="${r}" class="${UI.route === r ? 'on' : ''}" aria-label="${label}">${svg(ROUTES[r][1])}<span>${label}</span></button>`;
  const moreOn = MORE.includes(UI.route);
  return `<nav class="nav" aria-label="Main">${b('today', 'Today')}${b('tasks', 'Tasks')}
  <button class="add" data-a="quick" aria-label="Quick add">${svg('plus')}</button>
  ${b('focus', 'Focus')}<button data-a="more" class="${moreOn ? 'on' : ''}" aria-label="More">${svg('more')}<span>More</span></button></nav>`;
}
function header() {
  let title = ROUTES[UI.route][0], sub = '';
  if (UI.route === 'today') {
    const h = new Date().getHours(), n = S.settings.name;
    title = (h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + (n ? ', ' + esc(n) : '');
    sub = longDate(todayISO());
  }
  const chip = timerActive() && UI.route !== 'focus' ? `<button class="tchip" data-a="go" data-r="focus" aria-label="Focus timer">${svg('focus')}<span id="tmChipT" class="num">${fmtClock(timerLeft())}</span></button>` : '';
  return `<div class="top"><div class="grow"><h1>${title}</h1>${sub ? `<div class="datel">${sub}</div>` : ''}</div>${chip}
    <button class="iconbtn" data-a="go" data-r="settings" aria-label="Settings" title="Settings">${svg('gear')}</button></div>`;
}
function view() {
  switch (UI.route) {
    case 'tasks': return vTasks(); case 'week': return vWeek(); case 'dump': return vDump(); case 'habits': return vHabits();
    case 'routines': return vRoutines(); case 'focus': return vFocus(); case 'goals': return vGoals(); case 'settings': return vSettings();
    case 'help': return vHelp(); default: return vToday();
  }
}
function banners() {
  const out = [], s = S.settings, t = todayISO();
  if (!UI.storageOK && !IS_DEMO) out.push(`<div class="banner"><div><div class="ttl">This browser isn’t saving your plans</div>
    <div class="small">Private or incognito mode, or blocked site data, stops saving. Open your link in a normal window, or make backups often from Settings.</div></div></div>`);
  if (!IS_DEMO && !IS_FILE && !standalone() && (IS_IOS || UI.deferred) && !(s.installSnooze && s.installSnooze > t))
    out.push(`<div class="banner info"><div style="font-size:1.6rem">📲</div><div><div class="ttl">${IS_IOS ? 'Add Inkling Planner to your Home Screen' : 'Install Inkling Planner'}</div>
    <div class="small">${IS_IOS ? 'It opens like an app, works offline, and keeps Safari from clearing your plans after a week away.' : 'It opens like an app and works offline.'}</div>
    <div class="acts"><button class="btn sm" data-a="install">${IS_IOS ? 'Show me how' : 'Install'}</button><button class="btn sm ghost" data-a="snoozeInstall">Later</button></div></div></div>`);
  const daysSince = s.lastBackup ? diffDays(s.lastBackup, t) : null;
  if (!IS_DEMO && S.tasks.length > 5 && !s.sample && (daysSince === null || daysSince >= 14))
    out.push(`<div class="banner"><div style="font-size:1.6rem">💾</div><div><div class="ttl">${daysSince === null ? 'Make your first backup' : `Last backup was ${daysSince} days ago`}</div>
    <div class="small">Your plans live only on this device. A backup file keeps them safe if your phone is lost or the browser is cleared.</div>
    <div class="acts"><button class="btn sm" data-a="backup">Back up now</button></div></div></div>`);
  if (s.sample && !IS_DEMO) out.push(`<div class="banner info"><div style="font-size:1.6rem">🧪</div><div><div class="ttl">You’re exploring sample plans</div>
    <div class="small">Riley is made up. When you’re ready, clear the samples and set up your own.</div>
    <div class="acts"><button class="btn sm" data-a="startFresh">Start my own planner</button></div></div></div>`);
  return out.join('');
}

/* ---------------------------------------------------------------- task rows */
const RSHORT = { daily: 'daily', weekdays: 'weekdays', weekly: 'weekly', monthly: 'monthly' };
function taskMeta(t, o = {}) {
  const bits = [], d = todayISO();
  if (o.when && t.when) bits.push(relDay(t.when));
  if (!t.done && t.when && t.when < d && !o.when) bits.push(`from ${relDay(t.when).replace('Yesterday', 'yesterday')}`);
  if (t.area) bits.push(`<span class="adot" style="background:${areaColor(t.area)}"></span>${esc(t.area)}`);
  if (t.mins) bits.push(fmtMins(t.mins));
  if (t.energy) bits.push(`${ENERGY[t.energy][1]} ${ENERGY[t.energy][0].toLowerCase()}`);
  if (t.steps.length) bits.push(`${t.steps.filter(s => s.done).length}/${t.steps.length} steps`);
  if (t.repeat) bits.push('↻ ' + RSHORT[t.repeat]);
  return bits.join(' · ');
}
function taskRow(t, o = {}) {
  const d = todayISO(), on = !!t.done, top = t.top === d;
  let right = '';
  if (o.toToday && !on) right = `<button class="ci-btn" data-a="toToday" data-id="${t.id}">Today</button>`;
  else if (o.star !== false && !on) right = `<button class="star ${top ? 'on' : ''}" data-a="top" data-id="${t.id}" aria-pressed="${top}" aria-label="${top ? 'Remove from' : 'Add to'} Top 3: ${esc(t.title)}">${svg('star')}</button>`;
  return `<li class="li task ${on ? 'isdone' : ''}"><button class="check ${on ? 'on' : ''}" data-a="${on ? 'undoTask' : 'doneTask'}" data-id="${t.id}" aria-label="${on ? 'Mark not done' : 'Mark done'}: ${esc(t.title)}">✓</button>
    <div class="grow tap" data-a="editTask" data-id="${t.id}"><div class="name">${esc(t.title)}</div><div class="meta">${taskMeta(t, o)}</div></div>${right}</li>`;
}

/* ---------------------------------------------------------------- today */
function vToday() {
  const d = todayISO(), e = S.days[d]?.energy, all = todayTasks(), doneT = doneOn(d), total = all.length + doneT.length;
  let h = banners();
  if (!e) h += `<section class="card"><h2>How’s your energy right now?</h2><div class="echoices">${Object.entries(ENERGY).map(([k, [l, i]]) =>
    `<button class="echoice" data-a="energy" data-e="${k}"><span class="e">${i}</span><b>${l}</b></button>`).join('')}</div>
    <p class="tiny muted" style="margin:10px 0 0">Next up picks a task that fits. You can change it any time.</p></section>`;
  const n = nextUp(UI.skip);
  let hero = `<section class="card hero next"><div class="ring"></div><div class="lab">Next up${e ? ` <button class="echip" data-a="energyClear" aria-label="Change energy">${ENERGY[e][1]} ${ENERGY[e][0]} energy</button>` : ''}</div>`;
  if (n) {
    const ns = n.steps.find(s => !s.done);
    hero += `<div class="ntitle">${esc(n.title)}</div><div class="nmeta">${taskMeta(n)}</div>
      ${ns ? `<div class="nstep"><span>Next step: ${esc(ns.t)}</span><span class="sp"></span><button class="echip" data-a="stepDone" data-id="${n.id}" data-s="${ns.id}">Step done ✓</button></div>` : ''}
      <div class="hacts"><button class="hbtn pri" data-a="focusTask" data-id="${n.id}">${svg('play')} Start focus</button>
      <button class="hbtn" data-a="doneTask" data-id="${n.id}">${svg('check')} Done</button><button class="hbtn" data-a="skipTask" data-id="${n.id}">Later</button></div>`;
  } else if (all.length && UI.skip.length) {
    hero += `<div class="ntitle">You’ve set everything aside for now.</div><div class="nmeta">That’s allowed. Come back when you’re ready.</div>
      <div class="hacts"><button class="hbtn pri" data-a="skipReset">Show them again</button></div>`;
  } else if (doneT.length) {
    hero += `<div class="ntitle">All done for today 🎉</div><div class="nmeta">${plural(doneT.length, 'thing')} done. Resting counts too.</div>
      <div class="hacts"><button class="hbtn pri" data-a="quick">Add something</button><button class="hbtn" data-a="go" data-r="tasks" data-tab="someday">Look at Someday</button></div>`;
  } else {
    hero += `<div class="ntitle">Nothing planned yet.</div><div class="nmeta">Add a few things for today, or pick from Someday.</div>
      <div class="hacts"><button class="hbtn pri" data-a="quick">Add a task</button><button class="hbtn" data-a="go" data-r="tasks" data-tab="someday">Someday list</button></div>`;
  }
  h += hero + '</section>';
  const top = topToday();
  h += `<section class="card"><h2>Top 3<span class="sp"></span><span class="tiny muted" style="font-family:var(--sans)">Do these and today counts.</span></h2>
    ${top.length ? `<ul class="list">${top.map(t => taskRow(t)).join('')}</ul>` : ''}
    ${top.length < 3 ? `<p class="small muted" style="margin:${top.length ? '8px' : '0'} 0 0">${top.length ? `Room for ${3 - top.length} more.` : 'Pick up to three.'} Tap the ☆ on a task below.</p>` : ''}</section>`;
  
  const mine = all.filter(t => t.when === d && t.top !== d), carried = carriedTasks().filter(t => t.top !== d);
  h += `<section class="card"><h2>Today<span class="sp"></span><span class="small" style="font-family:var(--sans)"><b>${doneT.length}</b> <span class="muted">of ${total} done</span></span></h2>
    <div class="bar"><i style="width:${total ? doneT.length / total * 100 : 0}%"></i></div>
    <div class="tiny muted" style="margin:6px 2px 0">${all.length ? `About ${fmtMins(sum(all, t => t.mins))} left on the list` : 'Nothing left on the list'}${top.some(t => !t.done) ? ' · Top 3 shown above' : ''}</div>
    ${mine.length ? `<ul class="list">${mine.map(t => taskRow(t)).join('')}</ul>` : ''}
    ${carried.length ? `<div class="dayhead between"><span>Carried over</span><button class="ci-btn" data-a="moveAll">Move all to today</button></div><ul class="list">${carried.map(t => taskRow(t)).join('')}</ul>` : ''}
    <button class="btn sm ghost" style="margin-top:10px" data-a="addTask" data-when="${d}">${svg('plus', 'style="width:16px;height:16px"')} Add to today</button></section>`;
  // routines, habits, wins, brain dump
  const ws = weekStartOf(d), habits = S.habits.filter(x => !x.archived);
  const rCard = `<section class="card"><h2>Routines<span class="sp"></span><button class="link" data-a="go" data-r="routines">Open</button></h2>
    ${S.routines.length ? `<ul class="list">${S.routines.map(r => { const p = routineProgress(r); return `<li class="li tap" data-a="runRoutine" data-id="${r.id}"><div class="ico">${esc(r.icon)}</div>
    <div class="grow"><div class="name">${esc(r.name)}${r.freq === 'weekly' ? ' <span class="tiny muted">this week</span>' : ''}</div><div class="bar" style="margin-top:6px"><i style="width:${p.total ? p.done / p.total * 100 : 0}%"></i></div></div>
    <div class="val small">${p.complete ? '✓' : `${p.done}/${p.total}`}</div></li>`; }).join('')}</ul>` : `<div class="empty">Morning and evening checklists, so you don’t have to remember.<br><button class="btn sm" style="margin-top:10px" data-a="addRoutine">Add a routine</button></div>`}</section>`;
  const hCard = `<section class="card"><h2>Habits<span class="sp"></span><button class="link" data-a="go" data-r="habits">Open</button></h2>
    ${habits.length ? `<div class="hgrid">${habits.map(x => `<button class="hb ${habitOn(x, d) ? 'on' : ''}" data-a="habit" data-id="${x.id}" aria-pressed="${habitOn(x, d)}"><span class="e">${esc(x.icon)}</span>
    <span><span class="n">${esc(x.name)}</span><span class="c">${habitOn(x, d) ? 'Done today · ' : ''}${habitWeek(x, ws)}/${x.per} this week</span></span></button>`).join('')}</div>`
    : `<div class="empty">Small things you want to do most days.<br><button class="btn sm" style="margin-top:10px" data-a="addHabit">Add a habit</button></div>`}</section>`;
  const fm = focusOn(d), hd = habits.filter(x => habitOn(x, d)).length, rd = S.routines.filter(r => r.freq !== 'weekly' && routineProgress(r).complete).length;
  const wCard = `<section class="card"><h2>Today’s wins</h2>
    ${doneT.length || fm || hd || rd ? `<div class="wins">${doneT.length ? `<span>✅ ${plural(doneT.length, 'task')}</span>` : ''}${fm ? `<span>⏱️ ${fmtMins(fm)} focused</span>` : ''}${hd ? `<span>🔥 ${plural(hd, 'habit')}</span>` : ''}${rd ? `<span>🌅 ${plural(rd, 'routine')}</span>` : ''}</div>
    <ul class="list">${doneT.slice(0, 8).map(t => taskRow(t)).join('')}</ul>` : '<div class="empty">Your wins show up here as you go. Even small ones.</div>'}</section>`;
  const dCard = S.dump.length ? `<section class="card"><h2>Brain dump<span class="sp"></span><button class="link" data-a="go" data-r="dump">Sort</button></h2>
    <p class="small" style="margin:0">${plural(S.dump.length, 'thing')} waiting to be sorted. They won’t show on Today until you say so.</p></section>` : '';
  return h + `<div class="grid2">${rCard}${hCard}${wCard}${dCard}</div>
    <p class="tiny muted" style="text-align:center;margin:20px 0">A planning tool. “ADHD-friendly” describes the design, not a medical product.</p>`;
}

/* ---------------------------------------------------------------- tasks */
function vTasks() {
  const tab = UI.tab, a = UI.area, d = todayISO();
  const f = list => a ? list.filter(t => t.area === a) : list;
  const counts = { today: todayTasks().length, upcoming: upcomingTasks().length, someday: somedayTasks().length };
  let body = '';
  if (tab === 'today') {
    const l = f(todayTasks()), dn = f(doneOn(d));
    body = l.length ? `<ul class="list">${l.map(t => taskRow(t)).join('')}</ul>` : `<div class="empty"><span class="big">🌿</span>Nothing left for today${a ? ' in ' + esc(a) : ''}.</div>`;
    if (dn.length) body += `<div class="dayhead">Done today</div><ul class="list">${dn.map(t => taskRow(t)).join('')}</ul>`;
  } else if (tab === 'upcoming') {
    const l = f(upcomingTasks()); let day = '';
    for (const t of l) { if (t.when !== day) { if (day) body += '</ul>'; day = t.when; body += `<div class="dayhead">${relDay(day)} · ${shortDate(day)}<span class="tiny" style="float:right;text-transform:none;letter-spacing:0">${fmtMins(sum(tasksOn(day).filter(x => !a || x.area === a), x => x.mins))}</span></div><ul class="list">`; } body += taskRow(t, { star: false }); }
    if (day) body += '</ul>'; else body = '<div class="empty"><span class="big">🗓️</span>Nothing planned ahead. That’s fine.</div>';
  } else if (tab === 'someday') {
    const l = f(somedayTasks());
    body = l.length ? `<p class="small muted" style="margin:4px 2px 6px">Ideas and “one day” things. Tap Today when you’re ready for one.</p><ul class="list">${l.map(t => taskRow(t, { toToday: true })).join('')}</ul>`
      : '<div class="empty"><span class="big">💭</span>Someday is empty. Park ideas here so they stop nagging you.</div>';
  } else {
    const since = addDays(d, -30), l = f(S.tasks.filter(t => t.done && t.done >= since)).sort((x, y) => x.done < y.done ? 1 : x.done > y.done ? -1 : 0); let day = '';
    for (const t of l) { if (t.done !== day) { if (day) body += '</ul>'; day = t.done; body += `<div class="dayhead">${relDay(day)}</div><ul class="list">`; } body += taskRow(t); }
    if (day) body += '</ul>'; else body = '<div class="empty"><span class="big">✅</span>Things you finish in the last 30 days show here.</div>';
  }
  const areas = S.settings.areas;
  return `<div class="btns" style="margin-bottom:12px"><button class="btn" data-a="addTask" data-when="${tab === 'someday' ? '' : tab === 'upcoming' ? addDays(d, 1) : d}">${svg('plus', 'style="width:20px;height:20px"')} Add a task</button></div>
    <div class="seg tabs4" role="tablist">${[['today', 'Today'], ['upcoming', 'Upcoming'], ['someday', 'Someday'], ['done', 'Done']].map(([k, l]) =>
      `<button class="${tab === k ? 'on' : ''}" data-a="tab" data-t="${k}">${l}${counts[k] ? `<span class="tcnt">${counts[k]}</span>` : ''}</button>`).join('')}</div>
    ${areas.length ? `<div class="chips">${[''].concat(areas).map(x => `<button class="chip sm ${a === x ? 'on' : ''}" data-a="areaF" data-v="${esc(x)}">${x ? `<span class="adot" style="background:${areaColor(x)}"></span>${esc(x)}` : 'All areas'}</button>`).join('')}</div>` : ''}
    <section class="card" style="padding-top:6px">${body}</section>`;
}

/* ---------------------------------------------------------------- week */
function vWeek() {
  const t = todayISO(), ws = UI.wk || weekStartOf(t), days = weekDays(ws), R = weekReview(ws), cur = ws === weekStartOf(t);
  const cards = days.map(d => {
    const open = tasksOn(d), dn = doneOn(d), mins = sum(open, x => x.mins), e = S.days[d]?.energy;
    return `<section class="card dayc ${d === t ? 't' : ''}"><h2>${dayName(d)} <span class="muted" style="font-size:1.05rem">${shortDate(d)}</span><span class="sp"></span>
      <span class="tiny muted" style="font-family:var(--sans)">${e ? ENERGY[e][1] + ' ' : ''}${mins ? fmtMins(mins) : ''}</span></h2>
      ${open.length || dn.length ? `<ul class="list">${open.map(x => taskRow(x, { star: d === t })).join('')}${dn.map(x => taskRow(x)).join('')}</ul>` : `<p class="small muted" style="margin:0 0 4px">${d < t ? 'Nothing logged.' : 'Nothing planned. Leave room for life.'}</p>`}
      ${d >= t ? `<button class="btn sm ghost" style="margin-top:8px" data-a="addTask" data-when="${d}">${svg('plus', 'style="width:16px;height:16px"')} Add</button>` : ''}</section>`;
  }).join('');
  return `<div class="monthbar"><button data-a="wk" data-d="-7" aria-label="Previous week">‹</button><b>Week of ${shortDate(ws)}</b>${cur ? '' : '<button class="today" data-a="wkNow">This week</button>'}<button data-a="wk" data-d="7" aria-label="Next week">›</button></div>
    <section class="card"><h2>${cur ? 'This week so far' : 'Week review'}</h2><div class="tiles plain">
    <div class="tile"><div class="t">Tasks done</div><div class="v">${R.done}</div></div><div class="tile"><div class="t">Focused</div><div class="v">${fmtMins(R.focus)}</div></div>
    <div class="tile"><div class="t">Habit days</div><div class="v">${R.hDone}<span class="tiny muted">/${R.hTarget}</span></div></div></div>
    <p class="tiny muted" style="margin:10px 0 0">${R.routines ? `${plural(R.routines, 'routine')} finished. ` : ''}Look at what you did, not what you didn’t.</p></section>
    <div class="grid2">${cards}</div>`;
}

/* ---------------------------------------------------------------- brain dump */
function vDump() {
  return `<section class="card"><h2>Get it out of your head</h2>
    <textarea class="in" id="dumpIn" rows="3" placeholder="A worry, an idea, something to buy, a call to make… one per line"></textarea>
    <div class="btns" style="margin-top:10px"><button class="btn" data-a="dumpAdd">Add</button></div>
    <p class="tiny muted" style="margin:8px 0 0">Nothing here shows on Today until you sort it. Sort when you have a minute, not now.</p></section>
    <section class="card"><h2>To sort<span class="sp"></span>${S.dump.length ? `<span class="tiny muted" style="font-family:var(--sans)">${S.dump.length}</span>` : ''}</h2>
    ${S.dump.length ? `<ul class="list">${S.dump.map(x => `<li class="li dump"><div class="grow"><div class="name wrap">${esc(x.text)}</div><div class="meta">${relDay(x.at)}</div></div>
      <div class="dacts"><button class="ci-btn" data-a="dumpTo" data-id="${x.id}" data-w="today">Today</button><button class="ci-btn" data-a="dumpTo" data-id="${x.id}" data-w="someday">Someday</button>
      <button class="ci-btn" data-a="dumpEdit" data-id="${x.id}">Plan it…</button><button class="del" data-a="dumpDel" data-id="${x.id}" aria-label="Delete">✕</button></div></li>`).join('')}</ul>`
    : '<div class="empty"><span class="big">🌿</span>All sorted. Your head is clear (for now).</div>'}</section>`;
}

/* ---------------------------------------------------------------- habits */
function vHabits() {
  const t = todayISO(), ws = weekStartOf(t), days = weekDays(ws), hs = S.habits.filter(h => !h.archived);
  const cards = hs.map(h => {
    const st = habitStreak(h), wk = habitWeek(h, ws);
    return `<section class="card"><div class="row"><div class="ico">${esc(h.icon)}</div><div class="grow"><div style="font-weight:900;font-size:1.08rem">${esc(h.name)}</div>
      <div class="small muted">${num(h.per) >= 7 ? 'Every day' : `${h.per} times a week`} · <b class="${wk >= h.per ? 'good' : ''}">${wk}/${h.per}</b> this week</div></div>
      ${st.n ? `<span class="pill streak">🔥 ${plural(st.n, st.unit)}</span>` : ''}<button class="link" data-a="editHabit" data-id="${h.id}">Edit</button></div>
      <div class="dots">${days.map(d => `<button class="hd ${h.log[d] ? 'on' : ''} ${d === t ? 't' : ''}" data-a="habitDay" data-id="${h.id}" data-d="${d}" ${d > t ? 'disabled' : ''} aria-pressed="${!!h.log[d]}" aria-label="${dayName(d)}"><span>${dayName(d).slice(0, 1)}</span>${h.log[d] ? '✓' : ''}</button>`).join('')}</div></section>`;
  }).join('');
  return `<div class="btns" style="margin-bottom:14px"><button class="btn" data-a="addHabit">${svg('plus', 'style="width:20px;height:20px"')} New habit</button></div>
    ${cards ? `<div class="grid2">${cards}</div>` : `<section class="card"><div class="empty"><span class="big">🌱</span>Pick one or two small habits. Small and often beats big and never.</div></section>`}
    <p class="tiny muted" style="text-align:center">Tap a day to tick it. Missed a day? Tap it later. A streak counts days in a row (or weeks that hit your target).</p>`;
}

/* ---------------------------------------------------------------- routines */
function vRoutines() {
  const cards = S.routines.map(r => {
    const p = routineProgress(r);
    return `<section class="card"><h2>${esc(r.icon)} ${esc(r.name)}<span class="sp"></span><span class="small" style="font-family:var(--sans)">${p.complete ? '<span class="pill ok">Done ✓</span>' : `${p.done}/${p.total}${r.freq === 'weekly' ? ' this week' : ''}`}</span>
      <button class="link" data-a="editRoutine" data-id="${r.id}">Edit</button></h2>
      <div class="bar"><i style="width:${p.total ? p.done / p.total * 100 : 0}%"></i></div>

/* ---------------------------------------------------------------- focus timer */
const RC = 552.92;
const timerActive = () => !!(S.timer && (S.timer.end || S.timer.left != null));
function timerLeft() { const t = S.timer; if (!t) return null; if (t.end) return Math.max(0, t.end - Date.now()); return t.left != null ? t.left : null; }
const fmtClock = ms => { const s = Math.ceil((ms || 0) / 1000); return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; };
function vFocus() {
  const t = S.timer, active = timerActive(), running = !!t?.end, left = active ? timerLeft() : UI.fmins * 60000, total = active ? t.total * 60000 : UI.fmins * 60000;
  const d = todayISO(), sel = active ? t.task || '' : UI.ftask, list = todayTasks(), cur = sel && findTask(sel);
  const opts = list.concat(cur && !list.includes(cur) ? [cur] : []);
  const sessions = S.focus.filter(f => f.date === d).slice().reverse();
  return `<section class="card"><div class="tring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="88"/>
    <circle class="prg" id="tmRing" cx="100" cy="100" r="88" stroke-dasharray="${RC}" stroke-dashoffset="${(RC * (1 - left / total)).toFixed(2)}" transform="rotate(-90 100 100)"/></svg>
    <div class="tc"><div class="tt num" id="tmText" role="timer">${fmtClock(left)}</div><div class="tl">${running ? 'Focusing' : active ? 'Paused' : 'Ready when you are'}</div></div></div>
    <label class="f"><span>Focusing on</span><select class="in" data-c="ftask"><option value="">Just focusing</option>${opts.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.title)}</option>`).join('')}</select></label>
    ${active ? '' : `<div class="chips" style="justify-content:center">${[5, 15, 25, 45].map(m => `<button class="chip ${UI.fmins === m ? 'on' : ''}" data-a="fmins" data-m="${m}">${m} min</button>`).join('')}</div>`}
    <div class="btns">${!active ? `<button class="btn" data-a="tStart">${svg('play', 'style="width:20px;height:20px"')} Start</button>`
      : `${running ? `<button class="btn" data-a="tPause">${svg('pause', 'style="width:20px;height:20px"')} Pause</button>` : `<button class="btn" data-a="tResume">${svg('play', 'style="width:20px;height:20px"')} Resume</button>`}
      <button class="btn alt" data-a="tPlus">+5 min</button><button class="btn ghost" data-a="tStop">Stop</button>`}</div>
    ${cur && !cur.done ? `<button class="btn sm ghost wide" style="margin-top:10px" data-a="doneTask" data-id="${cur.id}">${svg('check', 'style="width:16px;height:16px"')} Mark “${esc(cur.title)}” done</button>` : ''}</section>
    <div class="grid2"><section class="card"><h2>Focus time</h2><div class="tiles plain" style="grid-template-columns:1fr 1fr">
    <div class="tile"><div class="t">Today</div><div class="v">${fmtMins(focusOn(d))}</div></div><div class="tile"><div class="t">This week</div><div class="v">${fmtMins(focusWeek(weekStartOf(d)))}</div></div></div>
    ${sessions.length ? `<ul class="list" style="margin-top:8px">${sessions.map(f => `<li class="li"><div class="ico">⏱️</div><div class="grow"><div class="name">${esc(f.title || 'Focus session')}</div></div><div class="val small">${fmtMins(f.mins)}</div></li>`).join('')}</ul>` : ''}</section>
    <section class="card"><h2>Tips</h2><ul class="small" style="padding-left:18px;margin:0;line-height:1.6"><li>Can’t start? Pick 5 minutes. Starting is the hard part.</li>
    <li>Put your phone face down and close other tabs.</li><li>Got distracted? Add the thought to Brain dump and carry on.</li><li>The timer keeps going if you switch apps or reload.</li></ul></section></div>`;
}
let tickIv = null, AC = null;
function ensureTick() { if (!tickIv) tickIv = setInterval(tick, 500); }
function tick() {
  const t = S.timer;
  if (!t || !t.end) { clearInterval(tickIv); tickIv = null; updateTimerUI(); return; }
  if (Date.now() >= t.end) { tFinish(false); return; }
  updateTimerUI();
}
function updateTimerUI() {
  const left = timerLeft(), t = S.timer;
  const tx = $('#tmText'); if (tx && left != null) tx.textContent = fmtClock(left);
  const ring = $('#tmRing'); if (ring && t && left != null) ring.setAttribute('stroke-dashoffset', (RC * (1 - left / (t.total * 60000))).toFixed(2));
  const c = $('#tmChipT'); if (c && left != null) c.textContent = fmtClock(left);
  document.title = t?.end ? `${fmtClock(left)} · ${BASE_TITLE}` : BASE_TITLE;
}
function unlockAudio() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) { } }
function chime() {
  if (!S.settings.sound) return;
  try { navigator.vibrate?.([180, 90, 180]); } catch (e) { }
  try {
    if (!AC) return;
    const now = AC.currentTime;
    [[660, 0], [880, 0.2], [1320, 0.4]].forEach(([f, o]) => {
      const os = AC.createOscillator(), g = AC.createGain(); os.type = 'sine'; os.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + o); g.gain.exponentialRampToValueAtTime(0.22, now + o + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, now + o + 0.7);
      os.connect(g); g.connect(AC.destination); os.start(now + o); os.stop(now + o + 0.75);
    });
  } catch (e) { }
}
function logFocus(mins, taskId) { const tk = taskId && findTask(taskId); S.focus.push({ id: uid(), date: todayISO(), mins, task: taskId || null, title: tk ? tk.title : '' }); }
function tStart(mins = UI.fmins, task = UI.ftask) { unlockAudio(); S.timer = { mins, total: mins, task: task || null, end: Date.now() + mins * 60000, left: null }; save(); render(); ensureTick(); }
function tFinish(away) {
  const t = S.timer; if (!t) return;
  logFocus(t.total, t.task); S.timer = null; save();
  if (!away) chime();
  render();
  const tk = t.task && findTask(t.task);
  openSheet(`${sheetHead('Time’s up')}<div class="empty" style="padding-top:4px"><span class="big">🎉</span><b>You focused for ${fmtMins(t.total)}.</b>${away ? '<br>It finished while you were away.' : ''}<br>Take a breath, stretch, get some water.</div>
    <div class="stack">${tk && !tk.done ? `<button class="btn wide" data-a="doneTask" data-id="${tk.id}" data-close="1">${svg('check', 'style="width:20px;height:20px"')} Mark “${esc(tk.title)}” done</button>` : ''}
    <button class="btn wide alt" data-a="tAgain" data-m="5" data-t="${t.task || ''}">5 more minutes</button><button class="btn wide ghost" data-a="closeSheet">Take a break</button></div>`);
}

/* ---------------------------------------------------------------- backup / restore */
async function doBackup() {
  const data = JSON.stringify({ app: 'inkling-planner', v: 1, exported: new Date().toISOString(), state: S }, null, 1);
  const name = `inkling-planner-backup-${todayISO()}.json`, blob = new Blob([data], { type: 'application/json' });
  let done = false;
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if ((IS_IOS || IS_ANDROID) && navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: 'Inkling Planner backup' }); done = true; }
  } catch (e) { if (e?.name === 'AbortError') return; }
  if (!done) downloadBlob(blob, name);
  S.settings.lastBackup = todayISO(); save(); render();
  toast('Backup saved. Keep the file somewhere safe.');
}
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function pickRestore() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let d; try { d = JSON.parse(r.result); } catch (e) { return toast('That file isn’t an Inkling Planner backup'); }
      const st = d?.state || d;
      if (!st || st.app !== 'inkling-planner' || !Array.isArray(st.tasks)) return toast(st?.app === 'inkling-budget' ? 'That’s an Inkling Budget backup. Restore it in Inkling Budget.' : 'That file isn’t an Inkling Planner backup');
      openSheet(`${sheetHead('Restore this backup?')}<p>Backup from <b>${d.exported ? longDate(d.exported.slice(0, 10)) : 'an unknown date'}</b> with ${plural(st.tasks.length, 'task')}, ${plural((st.habits || []).length, 'habit')} and ${plural((st.routines || []).length, 'routine')}.</p>
        <div class="banner"><div class="small">This replaces everything on this device. If you’re not sure, make a backup of what’s here first.</div></div>
        <div class="btns"><button class="btn" data-a="sheetSave">Restore</button><button class="btn alt" data-a="closeSheet">Cancel</button></div>`,
        () => { const snap = snapshot(); S = migrate(st); S.settings.onboarded = true; closeSheet(); commit(); undoable('Backup restored', snap); if (timerActive()) ensureTick(); });
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------------------------------------------------------------- toast */
let toastTimer;
function toast(msg, undo) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="toastUndo">Undo</button>' : ''}`;
  if (undo) $('#toastUndo').onclick = () => { t.classList.remove('on'); undo(); };
  t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), undo ? 6000 : 2600);
}

  editTask: el => { const t = findTask(el.dataset.id); if (t) openTask(t); },
  doneTask: el => {
    const t = findTask(el.dataset.id); if (!t || t.done) return;
    const snap = snapshot(); completeTask(t); UI.skip = UI.skip.filter(x => x !== t.id);
    if (el.dataset.close || $('#sheet')) closeSheet();
    commit(); askPersist(); undoable(CHEERS[Math.floor(Math.random() * CHEERS.length)], snap);
  },
  undoTask: el => { const t = findTask(el.dataset.id); if (!t) return; const snap = snapshot(); reopenTask(t); commit(); undoable('Marked not done', snap); },
  delTask: el => { const snap = snapshot(); S.tasks = S.tasks.filter(t => t.id !== el.dataset.id); closeSheet(); commit(); undoable('Task deleted', snap); },
  top: el => { const t = findTask(el.dataset.id); if (!t) return; if (!toggleTop(t)) return toast('Top 3 is full. Un-star one first.'); commit(); },
  toToday: el => { const t = findTask(el.dataset.id); if (!t) return; t.when = todayISO(); commit(); toast('Moved to today'); },
  moveAll: () => { const snap = snapshot(); moveToToday(carriedTasks()); commit(); undoable('Moved to today', snap); },
  skipTask: el => { UI.skip.push(el.dataset.id); render(); },
  skipReset: () => { UI.skip = []; render(); },
  stepDone: el => { const t = findTask(el.dataset.id), s = t?.steps.find(x => x.id === el.dataset.s); if (!s) return; s.done = true; commit(); toast(t.steps.every(x => x.done) ? 'All steps done. Tick the task when you’re ready.' : 'Step done ✓'); },
  focusTask: el => { UI.ftask = el.dataset.id; UI.route = 'focus'; render(); window.scrollTo(0, 0); },
  energy: el => { S.days[todayISO()] = Object.assign(S.days[todayISO()] || {}, { energy: el.dataset.e }); UI.skip = []; commit(); },
  energyClear: () => { if (S.days[todayISO()]) delete S.days[todayISO()].energy; commit(); },
  tab: el => { UI.tab = el.dataset.t; render(); },
  areaF: el => { UI.area = el.dataset.v; render(); },
  wk: el => { UI.wk = addDays(UI.wk || weekStartOf(todayISO()), Number(el.dataset.d)); render(); },
  wkNow: () => { UI.wk = null; render(); },
  // task sheet
  whenSeg: el => { readDraft(); UI.tDraft.mode = el.dataset.v; if (el.dataset.v === 'date' && !UI.tDraft.when) UI.tDraft.when = addDays(todayISO(), 2); taskSheet(); },
  pickOne: el => { const box = el.parentElement, was = el.classList.contains('on'); $$('.chip', box).forEach(c => c.classList.remove('on')); if (!(was && box.id === 't_area')) el.classList.add('on'); },
  dStep: el => { readDraft(); const s = UI.tDraft.steps.find(x => x.id === el.dataset.id); if (s) s.done = !s.done; taskSheet(); },
  dStepDel: el => { readDraft(); UI.tDraft.steps = UI.tDraft.steps.filter(x => x.id !== el.dataset.id); taskSheet(); },
  dStepAdd: () => { const d = readDraft(), v = $('#t_newstep').value.trim(); if (!v) return; d.steps.push({ id: uid(), t: v, done: false }); taskSheet(); $('#t_newstep')?.focus(); },
  lAdd: () => { UI.lRead(); const v = $('#l_new').value.trim(); if (!v) return; UI.lDraft.push({ id: uid(), t: v, done: false }); UI.lRender(); $('#l_new')?.focus(); },
  lDel: el => { UI.lRead(); UI.lDraft = UI.lDraft.filter(x => x.id !== el.dataset.id); UI.lRender(); },
  seg: el => { const s = el.closest('[data-seg]'); $$('button', s).forEach(b => b.classList.remove('on')); el.classList.add('on'); },
  sw: el => { el.classList.toggle('on'); el.setAttribute('aria-pressed', el.classList.contains('on')); },
  pickIcon: el => { $$('#f_icons button').forEach(b => b.classList.remove('on')); el.classList.add('on'); },
  sheetSave: () => UI.sheetSave?.(),
  closeSheet: () => { UI.lOwner = null; closeSheet(); },
  // brain dump
  dumpAdd: () => {
    const lines = ($('#dumpIn').value || '').split('\n').map(x => x.trim()).filter(Boolean); if (!lines.length) return toast('Type something first');
    for (const text of lines.reverse()) S.dump.unshift({ id: uid(), text: text.slice(0, 120), at: todayISO() });
    commit(); toast(lines.length > 1 ? `${lines.length} things added` : 'Added'); $('#dumpIn')?.focus();
  },
  dumpTo: el => {
    const x = S.dump.find(d => d.id === el.dataset.id); if (!x) return; const snap = snapshot();
    S.tasks.push(newTask({ title: x.text, when: el.dataset.w === 'today' ? todayISO() : '' })); S.dump = S.dump.filter(d => d !== x);
    commit(); undoable(el.dataset.w === 'today' ? 'Added to Today' : 'Moved to Someday', snap);
  },
  dumpEdit: el => { const x = S.dump.find(d => d.id === el.dataset.id); if (!x) return; S.dump = S.dump.filter(d => d !== x); save(); render(); openTask(null, { title: x.text, when: '' }); toast('Plan it, then Add task'); },
  dumpDel: el => { const snap = snapshot(); S.dump = S.dump.filter(d => d.id !== el.dataset.id); commit(); undoable('Deleted', snap); },
  // habits
  habit: el => { const h = S.habits.find(x => x.id === el.dataset.id); if (!h) return; toggleHabit(h); commit(); if (h.log[todayISO()]) toast(`${h.icon} ${h.name} ✓`); },
  habitDay: el => { const h = S.habits.find(x => x.id === el.dataset.id); if (!h || el.dataset.d > todayISO()) return; toggleHabit(h, el.dataset.d); commit(); },
  addHabit: () => habitSheet(null),
  editHabit: el => habitSheet(S.habits.find(x => x.id === el.dataset.id)),
  delHabit: el => { const snap = snapshot(); S.habits = S.habits.filter(x => x.id !== el.dataset.id); closeSheet(); commit(); undoable('Habit deleted', snap); },
  // routines
  rstep: el => { const r = S.routines.find(x => x.id === el.dataset.r); if (!r) return; toggleStep(r, el.dataset.s); commit(); if (routineProgress(r).complete) toast(`${r.name} done 🎉`); },
  runRoutine: el => { UI.runSkip = []; const r = S.routines.find(x => x.id === el.dataset.id); if (r) runSheet(r); },
  runDone: el => { const r = S.routines.find(x => x.id === el.dataset.r); if (!r) return; if (!stepDone(r, el.dataset.s)) toggleStep(r, el.dataset.s); save(); render(); runSheet(r); },
  runSkip: el => { UI.runSkip.push(el.dataset.s); runSheet(S.routines.find(x => x.id === el.dataset.r)); },
  runAgain: el => { UI.runSkip = []; runSheet(S.routines.find(x => x.id === el.dataset.r)); },
  addRoutine: () => { UI.lOwner = null; routineSheet(null); },
  editRoutine: el => { UI.lOwner = null; routineSheet(S.routines.find(x => x.id === el.dataset.id)); },
  delRoutine: el => { const snap = snapshot(); S.routines = S.routines.filter(x => x.id !== el.dataset.id); UI.lOwner = null; closeSheet(); commit(); undoable('Routine deleted', snap); },
  // goals
  addGoal: () => { UI.lOwner = null; goalSheet(null); },
  editGoal: el => { UI.lOwner = null; goalSheet(S.goals.find(x => x.id === el.dataset.id)); },
  delGoal: el => { const snap = snapshot(), id = el.dataset.id; S.goals = S.goals.filter(x => x.id !== id); for (const t of S.tasks) if (t.goal === id) t.goal = null; UI.lOwner = null; closeSheet(); commit(); undoable('Goal deleted (its tasks are kept)', snap); },
  gstep: el => { const g = S.goals.find(x => x.id === el.dataset.g), s = g?.steps.find(x => x.id === el.dataset.s); if (!s) return; s.done = !s.done; commit(); if (goalInfo(g).complete && s.done) toast(`${g.name}: every milestone done 🎉`); },
  // focus
  fmins: el => { UI.fmins = Number(el.dataset.m); render(); },
  tStart: () => tStart(),
  tPause: () => { const t = S.timer; if (!t?.end) return; t.left = timerLeft(); t.end = null; save(); render(); },
  tResume: () => { const t = S.timer; if (!t || t.left == null) return; unlockAudio(); t.end = Date.now() + t.left; t.left = null; save(); render(); ensureTick(); },
  tPlus: () => { const t = S.timer; if (!t) return; t.total += 5; if (t.end) t.end += 300000; else if (t.left != null) t.left += 300000; save(); render(); },
  tStop: () => {
    const t = S.timer; if (!t) return;
    const spent = Math.round((t.total * 60000 - (timerLeft() || 0)) / 60000);
    if (spent >= 1) logFocus(spent, t.task);
    S.timer = null; save(); render(); toast(spent >= 1 ? `Saved ${fmtMins(spent)} of focus` : 'Timer stopped');
  },
  tAgain: el => { closeSheet(true); tStart(Number(el.dataset.m), el.dataset.t || ''); },
  // settings
  weekStart: el => { S.settings.weekStart = Number(el.dataset.v); UI.wk = null; commit(); },
  areaAdd: () => { const v = ($('#areaNew').value || '').trim().slice(0, 18); if (!v) return; if (!S.settings.areas.includes(v)) S.settings.areas.push(v); commit(); },
  areaDel: el => { S.settings.areas = S.settings.areas.filter(a => a !== el.dataset.v); if (UI.area === el.dataset.v) UI.area = ''; commit(); },
  theme: el => { S.settings.theme = el.dataset.t; commit(); },
  accent: el => { S.settings.accent = el.dataset.k; commit(); },
  sound: () => { S.settings.sound = !S.settings.sound; commit(); },
  backup: () => doBackup(),
  restore: () => pickRestore(),
  csv: () => { downloadBlob(new Blob(['﻿' + tasksCSV()], { type: 'text/csv' }), `inkling-planner-tasks-${todayISO()}.csv`); toast('CSV saved'); },
  install: () => installSheet(),
  doInstall: async () => { const d = UI.deferred; if (!d) return; closeSheet(); d.prompt(); try { await d.userChoice; } catch (e) { } UI.deferred = null; render(); },
  snoozeInstall: () => { S.settings.installSnooze = addDays(todayISO(), 3); save(); render(); },
  loadSample: () => openSheet(`${sheetHead('Load sample plans?')}<p>This replaces everything on this device with a made-up week.</p><div class="btns"><button class="btn" data-a="sheetSave">Load samples</button><button class="btn alt" data-a="closeSheet">Cancel</button></div>`,
    () => { const snap = snapshot(), keep = { theme: S.settings.theme, accent: S.settings.accent, lastBackup: S.settings.lastBackup }; S = sampleState(); Object.assign(S.settings, keep); closeSheet(); UI.route = 'today'; commit(); undoable('Sample plans loaded', snap); }),
  startFresh: () => openSheet(`${sheetHead('Start your own planner?')}<p>This clears Riley’s sample plans and walks you through setup.</p><div class="btns"><button class="btn" data-a="sheetSave">Clear and set up</button><button class="btn alt" data-a="closeSheet">Cancel</button></div>`,
    () => { const keep = { theme: S.settings.theme, accent: S.settings.accent, lastBackup: S.settings.lastBackup }; S = blankState(); Object.assign(S.settings, keep); UI.obSel = null; UI.obDump = ''; closeSheet(); UI.ob = 1; save(); render(); }),
  erase: () => openSheet(`${sheetHead('Erase everything?')}<p>All tasks, habits, routines, goals and settings on this device will be deleted. Backup files you saved aren’t touched.</p>
    <label class="row small" style="margin:10px 0 16px"><input type="checkbox" id="f_sure" style="width:22px;height:22px"> I understand this can’t be undone</label>
    <div class="btns"><button class="btn danger" data-a="sheetSave">Erase</button><button class="btn alt" data-a="closeSheet">Cancel</button></div>`,
    () => { if (!$('#f_sure').checked) return toast('Tick the box to confirm'); S = blankState(); UI.ob = 0; UI.obSel = null; UI.obDump = ''; UI.route = 'today'; closeSheet(); save(); render(); toast('Everything erased'); }),
  // onboarding
  ob: el => {
    obCollect();
    if (el.dataset.skip) { if (UI.ob === 2) UI.obSel.habits.clear(); if (UI.ob === 3) UI.obSel.routines.clear(); if (UI.ob === 4) UI.obDump = ''; }
    UI.ob = Number(el.dataset.s); save(); render();
  },
  obToggle: el => { obCollect(); const set = UI.obSel[el.dataset.k], v = el.dataset.v; if (set.has(v)) set.delete(v); else set.add(v); render(); },
  obWeek: el => { obCollect(); S.settings.weekStart = Number(el.dataset.v); render(); },
  obSample: () => { S = sampleState(); save(); render(); },
  obDone: () => { obCollect(); obFinish(); UI.route = 'today'; save(); askPersist(); render(); }
};
const CHG = {
  name: el => { S.settings.name = el.value.trim(); save(); },
  ftask: el => { if (S.timer) { S.timer.task = el.value || null; save(); } else UI.ftask = el.value; }
};

/* ---------------------------------------------------------------- boot */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'A' || el.disabled) return;
  const a = el.dataset.a; if (!ACT[a]) return;
  e.preventDefault(); ACT[a](el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && CHG[el.dataset.c]) CHG[el.dataset.c](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet')) { UI.lOwner = null; closeSheet(); }
  if (e.key !== 'Enter' || e.isComposing) return;
  const id = e.target.id;
  if (id === 't_newstep') { e.preventDefault(); ACT.dStepAdd(); return; }
  if (id === 'l_new') { e.preventDefault(); ACT.lAdd(); return; }
  if (id === 'areaNew') { e.preventDefault(); ACT.areaAdd(); return; }
  if (id === 'dumpIn' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); ACT.dumpAdd(); return; }
  if ($('#sheet') && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && !e.target.dataset.stepT && !e.target.dataset.lst) { e.preventDefault(); UI.sheetSave?.(); }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); UI.deferred = e; if (S.settings.onboarded) render(); });
window.addEventListener('appinstalled', () => { UI.deferred = null; toast('Installed 🎉'); });
window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.settings.theme === 'auto') applyTheme(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.settings.onboarded && !$('#sheet')) { if (S.timer?.end) tick(); render(); } });

loadState();
render();
if (S.timer?.end) { if (Date.now() >= S.timer.end) tFinish(true); else ensureTick(); }
if (BUILD.sw && 'serviceWorker' in navigator && !IS_FILE) navigator.serviceWorker.register('sw.js').catch(() => { });

</script>
</body>
</html>

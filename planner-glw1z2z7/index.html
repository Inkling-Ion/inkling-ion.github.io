:root{
  --bg:#F7F5EF;--panel:#FFFFFF;--panel2:#EEF3EF;--ink:#26302B;--muted:#6B746F;--line:#E2DED4;
  --acc:#3E6B57;--acc-ink:#FFFFFF;--acc-soft:#E3EEE8;
  --good:#2F7A4E;--good-bg:#E3F2E7;--bad:#B42318;--bad-bg:#FDE2E1;--warn:#9A6414;--warn-bg:#FCEFD6;
  --g-Income:#3E6B57;--g-Bills:#4F6D8A;--g-Needs:#A87F2D;--g-Wants:#B5654A;--g-Savings:#5E8C7A;--g-Debt:#7A5C8C;
  --shadow:0 1px 2px rgba(30,40,35,.06),0 6px 20px rgba(30,40,35,.06);
  --r:18px;--serif:'Instrument Serif',Georgia,serif;--sans:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
:root[data-accent=slate]{--acc:#4F6D8A;--acc-soft:#E3EAF2}
:root[data-accent=terra]{--acc:#B5654A;--acc-soft:#F6E5DE}
:root[data-accent=plum]{--acc:#7A5C8C;--acc-soft:#ECE4F1}
:root[data-theme=dark]{
  --bg:#171C1A;--panel:#212825;--panel2:#29312D;--ink:#ECEFEA;--muted:#9AA59F;--line:#333D38;
  --acc:#8DC0A6;--acc-ink:#14201A;--acc-soft:#26372F;
  --good:#8DC0A6;--good-bg:#21352B;--bad:#F09A8A;--bad-bg:#43272A;--warn:#E8BE6A;--warn-bg:#3F3420;
  --g-Income:#8DC0A6;--g-Bills:#8FB0CF;--g-Needs:#D9B064;--g-Wants:#DE9A7E;--g-Savings:#79B8A0;--g-Debt:#B595C9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark;
}
:root[data-theme=dark][data-accent=slate]{--acc:#8FB0CF;--acc-soft:#25313D}
:root[data-theme=dark][data-accent=terra]{--acc:#DE9A7E;--acc-soft:#3D2C25}
:root[data-theme=dark][data-accent=plum]{--acc:#B595C9;--acc-soft:#33293B}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
h1,h2,h3{margin:0;font-weight:400}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.78rem}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
body.hide .amt{filter:blur(7px);user-select:none}

/* layout */
.shell{max-width:1180px;margin:0 auto;display:flex;gap:28px;padding:0 16px}
.side{display:none}
main{flex:1;min-width:0;padding-top:8px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;margin:0 -16px 6px;display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--serif);font-size:1.9rem;line-height:1.1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:1.05rem;flex:none}
.iconbtn svg{width:20px;height:20px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin:0 0 14px}
.monthbar button{border:0;background:transparent;width:40px;height:36px;border-radius:999px;font-size:1.2rem;color:var(--muted)}
.monthbar button:hover{background:var(--panel2)}
.monthbar b{font-weight:800}
.monthbar .today{font-size:.78rem;width:auto;padding:0 12px;color:var(--acc);font-weight:800}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-family:var(--serif);font-size:1.45rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.card h2 .btn,.card h2 .ci-btn,.card h2 .pill{font-family:var(--sans)}
.card h2 .link{font-family:var(--sans);font-size:.85rem;font-weight:800;color:var(--acc);background:none;border:0;padding:4px 2px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
.grid2>.card{margin-bottom:0}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.empty .big{font-size:2rem;display:block;margin-bottom:6px}

/* hero */
.hero{background:var(--acc);color:var(--acc-ink);border:0;position:relative;overflow:hidden}
.hero .lab{font-weight:800;opacity:.9;font-size:.95rem}
.hero .big{font-weight:900;font-size:clamp(2.6rem,11vw,3.6rem);line-height:1.05;letter-spacing:-.02em;margin:2px 0 4px}
.hero .sub{opacity:.92;font-size:.95rem}
.hero .neg{color:#FFE1DA}
:root[data-theme=dark] .hero .neg{color:#7A1E14}
.hero .how{background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:800;margin-top:10px}
:root[data-theme=dark] .hero .how{background:rgba(0,0,0,.14)}
.hero .ring{position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;border:26px solid rgba(255,255,255,.09)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tile{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
:root[data-theme=dark] .tile{background:rgba(0,0,0,.12)}
.tile .t{font-size:.76rem;font-weight:800;opacity:.85;text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-weight:900;font-size:1.12rem}
.breakdown{margin-top:10px;font-size:.9rem;background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;display:none}
.breakdown.on{display:block}
.breakdown div{display:flex;justify-content:space-between;padding:2px 0}
.breakdown .tot{border-top:1px solid rgba(255,255,255,.35);margin-top:4px;padding-top:6px;font-weight:900}

/* lists */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.vstack{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.li.tap{cursor:pointer;border-radius:10px}
.li.tap:hover{background:var(--panel2)}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;flex:none;background:var(--panel2)}
.li .name{font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .val{font-weight:900;text-align:right;white-space:nowrap}
.dayhead{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 2px 2px}
.pill{display:inline-block;font-size:.72rem;font-weight:900;border-radius:999px;padding:3px 9px;white-space:nowrap}
.st-paid{background:var(--good-bg);color:var(--good)}
.st-overdue{background:var(--bad-bg);color:var(--bad)}
.st-soon{background:var(--warn-bg);color:var(--warn)}
.st-upcoming{background:var(--panel2);color:var(--muted)}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none;font-weight:900;color:transparent}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
:root[data-theme=dark] .check.on{color:#14201A}

/* bars */
.bar{height:10px;border-radius:999px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--good)}
.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}.bar.muted>i{background:var(--muted)}
.gbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--panel2);margin:6px 0 10px}
.gbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* check-in */
.checkin .li{padding:8px 2px}
.ci-btn{border:0;background:var(--acc-soft);color:var(--acc);font-weight:900;border-radius:999px;padding:8px 14px;font-size:.85rem;white-space:nowrap}
.banner{border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner .ttl{font-weight:900}
.banner.info{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 25%,transparent)}
.banner .x{margin-left:auto;border:0;background:none;font-size:1.2rem;color:var(--muted);padding:0 4px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.demo{background:#26302B;color:#F7F5EF;text-align:center;padding:8px 14px;font-size:.85rem;font-weight:800}
.demo a{color:#D9B064}

/* buttons + forms */
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:900;background:var(--acc);color:var(--acc-ink);min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.alt{background:var(--panel2);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:8px 14px;border-radius:12px;font-size:.9rem}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-weight:800;font-size:.88rem;margin-bottom:5px}
label.f>small{display:block;color:var(--muted);font-size:.8rem;margin-top:4px}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 13px;min-height:48px;font-size:16px}
.in:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px var(--acc-soft)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--panel2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 6px;font-weight:800;color:var(--muted);min-height:42px}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 12px;font-weight:800;font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.chip.sm{padding:6px 10px;font-size:.82rem}
.amount{font-weight:900;font-size:2.4rem;text-align:center;border:0;background:transparent;width:100%;padding:4px;min-height:auto}
.amount:focus{outline:none;box-shadow:none}
.amtwrap{background:var(--panel2);border-radius:18px;padding:10px 12px 12px;margin-bottom:12px;text-align:center}
.after{font-size:.9rem;font-weight:800}
.quick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.quick button{border:0;background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.sw{position:relative;width:52px;height:30px;border-radius:999px;background:var(--line);border:0;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--acc)}.sw.on::after{left:25px}
.iconpick{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px}
.iconpick button{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;font-size:1.2rem;aspect-ratio:1;padding:0}
.iconpick button.on{border-color:var(--acc);background:var(--acc-soft)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:800;color:var(--muted);padding:6px 4px;min-width:62px;border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--acc)}
.nav .add{width:60px;height:60px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px rgba(0,0,0,.18);min-width:0;padding:0}
.nav .add svg{width:28px;height:28px}
.sidenav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:11px 14px;border-radius:12px;font-weight:800;color:var(--muted);text-align:left}
.sidenav button svg{width:20px;height:20px;flex:none}
.sidenav button:hover{background:var(--panel2)}
.sidenav button.on{background:var(--acc-soft);color:var(--acc)}
.brand{display:flex;align-items:center;gap:10px;padding:22px 14px 16px}
.brand .mk{width:38px;height:38px;flex:none}
.brand b{font-family:var(--serif);font-size:1.5rem;font-weight:400;line-height:1}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.04em}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(15,20,18,.42);z-index:50;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease;-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--serif);font-size:1.7rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sheet h3 .sp{flex:1}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:#26302B;color:#F7F5EF;
  border-radius:14px;padding:12px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:all .2s;max-width:calc(100vw - 32px);font-weight:700;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{border:0;background:none;color:#D9B064;font-weight:900;padding:4px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:.72rem;font-weight:900;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{min-height:62px;border-radius:10px;background:var(--panel2);padding:4px;font-size:.75rem;position:relative;overflow:hidden}
.cal .d.x{background:transparent}
.cal .d.t{outline:2px solid var(--acc)}
.cal .d b{font-weight:900;font-size:.8rem}
.cal .ev{display:block;border-radius:6px;padding:1px 4px;margin-top:2px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.68rem}
.cal .ev.pay{background:var(--good-bg);color:var(--good)}

/* charts */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:700 11px var(--sans)}

/* onboarding */
.ob{max-width:560px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 18px 40px}
.ob h1{font-family:var(--serif);font-size:2.5rem;line-height:1.05;margin-bottom:10px}
.ob .step{font-weight:900;color:var(--acc);font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.ob .lead{font-size:1.08rem;color:var(--muted);margin:0 0 18px}
.choice{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;margin-bottom:10px}
.choice.on{border-color:var(--acc);background:var(--acc-soft)}
.choice .e{font-size:1.8rem}
.choice b{display:block}
.catrow{display:grid;grid-template-columns:auto 1fr 110px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.catrow .in{min-height:42px;padding:8px 10px}
.catrow .del{border:0;background:none;color:var(--muted);font-size:1.2rem;width:34px;height:34px}

/* print */
@media print{.nav,.side,.top .iconbtn,.banner,.toast{display:none!important}body{padding:0;background:#fff}.card{box-shadow:none;break-inside:avoid}}

@media (min-width:720px){
  .grid2{grid-template-columns:1fr 1fr}
  .tiles .tile .v{font-size:1.3rem}
}
@media (min-width:980px){
  body{padding-bottom:30px}
  .nav{display:none}
  .side{display:block;width:240px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;padding-bottom:20px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,92vw);border-radius:24px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:all .2s;max-height:88vh}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .sheet .grab{display:none}
  .toast{bottom:30px}
  .top{padding-top:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>

<script>
const BUILD={"mode": "app", "version": "1.1.0", "sw": true, "storeKey": "inkion.budget.v1"};

'use strict';

/* ---------------------------------------------------------------- utilities */
const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const round2 = n => Math.round((Number(n) || 0) * 100) / 100;
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const sum = (arr, f = x => x) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);

const pad = n => String(n).padStart(2, '0');
const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const toISO = d => iso(d.getFullYear(), d.getMonth() + 1, d.getDate());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const todayISO = () => toISO(new Date());
const monthOf = s => String(s).slice(0, 7);
const daysIn = (y, m) => new Date(y, m, 0).getDate();
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const addMonthsKey = (M, n) => { let [y, m] = M.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; };
const monthIndex = M => { const [y, m] = M.split('-').map(Number); return y * 12 + m - 1; };
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = MONTHS.map(m => m.slice(0, 3));
const monthLabel = M => { const [y, m] = M.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const shortDate = s => { const d = parseISO(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const longDate = s => { const d = parseISO(s); return `${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };

/* ---------------------------------------------------------------- constants */
const GROUPS = ['Income', 'Bills', 'Needs', 'Wants', 'Savings', 'Debt'];
const OUT_GROUPS = ['Bills', 'Needs', 'Wants', 'Debt'];
const GROUP_INFO = {
  Income: 'Money coming in', Bills: 'Fixed, regular costs', Needs: 'Everyday essentials',
  Wants: 'Nice-to-haves', Savings: 'Money you put aside', Debt: 'Paying down what you owe'
};
const CURRENCIES = [
  ['USD', 'US dollar'], ['CAD', 'Canadian dollar'], ['GBP', 'British pound'], ['EUR', 'Euro'], ['AUD', 'Australian dollar'],
  ['NZD', 'New Zealand dollar'], ['INR', 'Indian rupee'], ['PHP', 'Philippine peso'], ['ZAR', 'South African rand'],
  ['SGD', 'Singapore dollar'], ['MXN', 'Mexican peso'], ['JPY', 'Japanese yen'], ['CHF', 'Swiss franc'], ['SEK', 'Swedish krona'],
  ['NOK', 'Norwegian krone'], ['DKK', 'Danish krone'], ['PLN', 'Polish zloty'], ['BRL', 'Brazilian real']
];
const ICONS = ['💰', '💵', '🏠', '⚡', '💧', '📶', '📱', '🛡️', '📺', '🛒', '⛽', '🧺', '🩺', '👶', '🐾', '🍽️', '🛍️', '🎉', '🎁', '🎨',
  '🚗', '🎓', '💳', '🏦', '🌴', '🔧', '🎄', '✈️', '📚', '💪', '☕', '🍕', '🎮', '💡', '🧾', '🚌', '💇', '🪴', '🐷', '⭐'];
const FREQS = { weekly: 'Every week', biweekly: 'Every 2 weeks', monthly: 'Every month', quarterly: 'Every 3 months', yearly: 'Every year' };
const PAYFREQS = { weekly: 'Every week', biweekly: 'Every 2 weeks', semimonthly: 'Twice a month', monthly: 'Once a month' };
const ACCENTS = { sage: 'Sage', slate: 'Slate', terra: 'Clay', plum: 'Plum' };

/* ---------------------------------------------------------------- state */
const STARTER_CATS = [
  ['Paycheck', 'Income', 0, '💵'], ['Side income', 'Income', 0, '💰'],
  ['Rent / mortgage', 'Bills', 0, '🏠'], ['Electric', 'Bills', 0, '⚡'], ['Water', 'Bills', 0, '💧'], ['Internet', 'Bills', 0, '📶'],
  ['Phone', 'Bills', 0, '📱'], ['Insurance', 'Bills', 0, '🛡️'], ['Subscriptions', 'Bills', 0, '📺'],
  ['Groceries', 'Needs', 0, '🛒'], ['Gas & transport', 'Needs', 0, '⛽'], ['Household', 'Needs', 0, '🧺'], ['Medical', 'Needs', 0, '🩺'],
  ['Dining out', 'Wants', 0, '🍽️'], ['Shopping', 'Wants', 0, '🛍️'], ['Fun', 'Wants', 0, '🎉'], ['Gifts', 'Wants', 0, '🎁'],
  ['Emergency fund', 'Savings', 0, '🐷'],
  ['Credit card', 'Debt', 0, '💳']
];

function blankState() {
  return {
    app: 'inkling-budget', v: 1,
    settings: {
      onboarded: false, mode: 'solo', p1: '', p2: '', currency: 'USD', theme: 'auto', accent: 'sage', hide: false,
      split: '5050', customP1: 50, lastBackup: null, installSnooze: null, created: todayISO(), persisted: null, sample: false
    },
    cats: STARTER_CATS.map(([name, group, budget, icon]) => ({ id: uid(), name, group, budget, icon, owner: 'shared' })),

/* Next Dec 25 (today counts). */
function nextHoliday() { const t = todayISO(), y = Number(t.slice(0, 4)), d = iso(y, 12, 25); return d >= t ? d : iso(y + 1, 12, 25); }

function migrate(s) {
  const b = blankState();
  if (!s || typeof s !== 'object') return b;
  s.settings = Object.assign({}, b.settings, s.settings || {});

  if (!s.nw.hist || typeof s.nw.hist !== 'object') s.nw.hist = {};
  for (const bl of s.bills) if (!bl.paid || typeof bl.paid !== 'object') bl.paid = {};
  for (const p of s.pays) if (!p.logged || typeof p.logged !== 'object') p.logged = {};

/* ---------------------------------------------------------------- bills + paychecks */
function occursMonthly(anchorISO, M, stepMonths, day) {
  const a = parseISO(anchorISO), [y, m] = M.split('-').map(Number);
  const diff = monthIndex(M) - (a.getFullYear() * 12 + a.getMonth());
  if (((diff % stepMonths) + stepMonths) % stepMonths !== 0) return [];
  return [iso(y, m, Math.min(day || a.getDate(), daysIn(y, m)))];
}

  let k = Math.ceil(diffDays(anchorISO, first) / stepDays);
  const out = [];
  for (let d = addDays(anchorISO, k * stepDays); d <= last; d = addDays(d, stepDays)) if (d >= first) out.push(d);

}

    case 'biweekly': out = occursEvery(b.start, M, 14); break;
    case 'quarterly': out = occursMonthly(b.start, M, 3, num(b.day) || parseISO(b.start).getDate()); break;
    case 'yearly': out = occursMonthly(b.start, M, 12, num(b.day) || parseISO(b.start).getDate()); break;
    default: { const [y, m] = M.split('-').map(Number); out = [iso(y, m, Math.min(num(b.day) || 1, daysIn(y, m)))]; }

}

    case 'biweekly': return occursEvery(p.start, M, 14);

/* ---------------------------------------------------------------- month totals */
function monthTotals(M) {
  const tx = txIn(M);
  const inc = sum(tx.filter(t => t.type === 'in'), t => t.amt);
  const out = g => sum(tx.filter(t => t.type === 'out' && catGroup(t.cat) === g), t => t.amt);
  const byGroup = Object.fromEntries(OUT_GROUPS.concat('Savings').map(g => [g, out(g)]));
  const spent = sum(OUT_GROUPS, g => byGroup[g]);
  const saved = byGroup.Savings;
  const t = todayISO(), curM = monthOf(t);
  const occ = billsInMonth(M);

  const billsLeft = M < curM ? 0 : sum(unpaid, o => o.b.amt);
  const payLeft = M < curM ? 0 : sum(paysInMonth(M).filter(o => !o.logged), o => o.p.amt);
  const left = round2(inc + payLeft - spent - saved - billsLeft);
  let daysLeft = null;
  if (M === curM) { const [y, m] = M.split('-').map(Number); daysLeft = daysIn(y, m) - parseISO(t).getDate() + 1; }

/* ---------------------------------------------------------------- couples */
function p1Share(c) {
  if (c?.owner === 'p1') return 1;
  if (c?.owner === 'p2') return 0;
  const s = S.settings;
  if (s.split === 'custom') return clamp(num(s.customP1), 0, 100) / 100;
  if (s.split === 'income') {

    const inc = S.tx.filter(t => t.type === 'in' && t.date.startsWith(y) && catGroup(t.cat) === 'Income');
    const a = sum(inc.filter(t => t.who === 'p1'), t => t.amt), b = sum(inc.filter(t => t.who === 'p2'), t => t.amt);

function settleBalance() {

    if (t.type !== 'out' || (t.who !== 'p1' && t.who !== 'p2')) continue;

/* ---------------------------------------------------------------- debt payoff */
function promoActive(d, M) { return d.promoEnd && num(d.promoApr) >= 0 && M <= monthOf(d.promoEnd); }

  const startM = monthOf(todayISO());

  const budget = sum(ds, d => d.min) + (minsOnly ? 0 : Math.max(0, num(extra)));
  let month = 0, totalInt = 0;

    const M = addMonthsKey(startM, month); month++;
    for (const d of ds) if (d.b > 0.005) { const i = d.b * rateFor(d.src, M) / 1200; d.b += i; d.interest += i; totalInt += i; }
    let avail = budget;
    for (const d of ds) if (d.b > 0.005) { const p = Math.min(d.min, d.b); d.b -= p; avail -= p; }

  const goalsCard = `<section class="card"><h2>Savings goals<span class="sp"></span><button class="link" data-a="go" data-r="goals">Open</button></h2>${goals || `<div class="empty">Saving for something?<br><button class="btn sm" style="margin-top:10px" data-a="addGoal">Add a goal</button></div>`}</section>`;
  let debtCard = '';
  if (S.debts.some(d => num(d.bal) > 0)) {
    const sim = simulateDebts(S.debts, S.debtPlan.strategy, S.debtPlan.extra, false);
    debtCard = `<section class="card"><h2>Debt-free<span class="sp"></span><button class="link" data-a="go" data-r="debt">Plan</button></h2>
      <div style="font-weight:900;font-size:1.7rem">${sim.stuck ? 'Not yet in reach' : monthLabel(addMonthsKey(sim.startM, sim.months - 1))}</div>
      <div class="muted small">${money(sum(S.debts, d => d.bal))} to go · ${S.debtPlan.strategy === 'snowball' ? 'Snowball' : 'Avalanche'} plan</div></section>`;
  }
  let coupleCard = '';
  if (isCouple()) {
    const b = settleBalance();
    coupleCard = `<section class="card"><h2>Settle up<span class="sp"></span></h2>
      <div style="font-weight:900;font-size:1.35rem">${Math.abs(b) < 0.01 ? 'All square 🤝' : `${esc(pName(b > 0 ? 'p2' : 'p1'))} owes ${esc(pName(b > 0 ? 'p1' : 'p2'))} ${money(Math.abs(b))}`}</div>
      <div class="muted small">Based on who paid for shared costs (split: ${splitLabel()}).</div>
      ${Math.abs(b) >= 0.01 ? `<button class="btn sm alt" style="margin-top:10px" data-a="settle">Record a settle-up</button>` : ''}</section>`;
  }
  let giftsCard = '';
  const GT = giftTotals();
  if (S.gifts.people.length && (GT.days === null || GT.days >= 0)) {
    giftsCard = `<section class="card"><h2>${esc(S.gifts.title || 'Gift list')}<span class="sp"></span><button class="link" data-a="go" data-r="gifts">Open</button></h2>
      <div class="between small" style="margin-bottom:6px"><span class="muted">${GT.bought} of ${plural(GT.count, 'gift')} bought${GT.days !== null ? ` · ${GT.days === 0 ? 'today' : plural(GT.days, 'day') + ' to go'}` : ''}</span>
      <span><b>${money(GT.spent, true)}</b> <span class="muted">of ${money(GT.budget, true)}</span></span></div>
      <div class="bar ${GT.budget && GT.spent > GT.budget ? 'bad' : GT.budget && GT.proj > GT.budget ? 'warn' : ''}"><i style="width:${GT.budget ? Math.min(100, GT.spent / GT.budget * 100) : 0}%"></i></div></section>`;
  }
  return banners() + hero + ci + `<div class="grid2">${billsCard}${groupsCard}${overCard}${goalsCard}${giftsCard}${debtCard}${coupleCard}</div>
    <p class="tiny muted" style="text-align:center;margin:20px 0">A budgeting tool, not financial, tax or legal advice.</p>`;
}
function splitLabel() { const s = S.settings; return s.split === 'income' ? 'by income' : s.split === 'custom' ? `${clamp(num(s.customP1), 0, 100)}/${100 - clamp(num(s.customP1), 0, 100)}` : '50/50'; }

/* ---------------------------------------------------------------- spending */
function vSpending() {
  const M = UI.M, q = UI.txQ.trim().toLowerCase();
  let tx = txIn(M);
  if (UI.txF === 'in') tx = tx.filter(t => t.type === 'in'); else if (UI.txF === 'out') tx = tx.filter(t => t.type === 'out');
  if (q) tx = tx.filter(t => (t.note || '').toLowerCase().includes(q) || catName(t.cat).toLowerCase().includes(q) || String(t.amt).includes(q));
  tx.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const all = txIn(M), tin = sum(all.filter(t => t.type === 'in'), t => t.amt), tout = sum(all.filter(t => t.type === 'out'), t => t.amt);
  let body = '', day = '';
  for (const t of tx) {
    if (t.date !== day) { if (day) body += '</ul>'; day = t.date; body += `<div class="dayhead">${longDate(day)}</div><ul class="list">`; }
    body += txRow(t);
  }
  if (day) body += '</ul>';
  return `<section class="card"><div class="tiles" style="margin-top:0"><div><div class="tiny muted"><b>MONEY IN</b></div><div style="font-weight:900;font-size:1.2rem" class="good">${money(tin)}</div></div>
    <div><div class="tiny muted"><b>MONEY OUT</b></div><div style="font-weight:900;font-size:1.2rem">${money(tout)}</div></div>
    <div><div class="tiny muted"><b>ENTRIES</b></div><div style="font-weight:900;font-size:1.2rem">${all.length}</div></div></div></section>
    <div class="row" style="margin-bottom:10px"><input class="in grow" type="search" placeholder="Search notes or categories" value="${esc(UI.txQ)}" data-c="txQ" aria-label="Search"></div>
    <div class="seg" role="tablist">${[['all', 'All'], ['out', 'Money out'], ['in', 'Money in']].map(([k, l]) => `<button class="${UI.txF === k ? 'on' : ''}" data-a="txF" data-f="${k}">${l}</button>`).join('')}</div>
    <section class="card" style="padding-top:4px">${body || `<div class="empty"><span class="big">🧾</span>${q ? 'Nothing matches that search.' : 'Nothing logged in ' + monthLabel(M) + ' yet.'}<br>
    <button class="btn sm" style="margin-top:10px" data-a="addTx">Add an entry</button></div>`}</section>
    <div class="btns"><button class="btn alt" data-a="csv">Export to spreadsheet (CSV)</button></div>`;
}
function txRow(t) {
  if (t.type === 'settle') return `<li class="li tap" data-a="editTx" data-id="${t.id}"><div class="ico">🤝</div><div class="grow"><div class="name">Settle-up</div>
    <div class="meta">${esc(pName(t.from))} paid ${esc(pName(t.to))}</div></div><div class="val muted">${money(t.amt)}</div></li>`;
  const c = cat(t.cat), meta = [c ? c.name : 'Uncategorized'];
  if (isCouple()) meta.push(pName(t.who));
  if (t.bill) meta.push('bill'); if (t.pay) meta.push('payday');
  return `<li class="li tap" data-a="editTx" data-id="${t.id}"><div class="ico">${esc(c?.icon || '•')}</div><div class="grow"><div class="name">${esc(t.note || c?.name || 'Entry')}</div>
    <div class="meta">${esc(meta.join(' · '))}</div></div><div class="val ${t.type === 'in' ? 'good' : ''}">${t.type === 'in' ? '+' : ''}${money(t.amt)}</div></li>`;
}

/* ---------------------------------------------------------------- bills */
function billRow(o, compact) {
  const b = o.b, on = o.st === 'paid';
  const meta = [`${on ? 'Paid' : 'Due'} ${shortDate(o.d)}`];
  if (b.autopay) meta.push('autopay'); if (isCouple() && b.who) meta.push(b.who === 'joint' ? 'joint account' : pName(b.who) + ' pays');
  return `<li class="li"><button class="check ${on ? 'on' : ''}" data-a="${on ? 'untick' : 'tick'}" data-b="${b.id}" data-d="${o.d}" aria-label="${on ? 'Mark ' + esc(b.name) + ' unpaid' : 'Mark ' + esc(b.name) + ' paid'}">✓</button>
    <div class="grow tap" data-a="editBill" data-id="${b.id}" style="cursor:pointer;min-width:0"><div class="name">${esc(b.name)}</div><div class="meta">${esc(meta.join(' · '))}</div></div>
    <div class="vstack"><div class="val">${money(b.amt)}</div>${compact ? '' : `<span class="pill st-${o.st}">${STATUS_LABEL[o.st]}</span>`}</div></li>`;
}
function vBills() {
  const M = UI.M, occ = billsInMonth(M), paid = occ.filter(o => o.st === 'paid');
  const head = `<section class="card"><div class="between"><div><div style="font-weight:900;font-size:1.5rem">${money(sum(occ.filter(o => o.st !== 'paid'), o => o.b.amt))}</div>
    <div class="muted small">still to pay · ${paid.length} of ${occ.length} paid</div></div><button class="btn sm" data-a="addBill">${svg('plus', 'style="width:18px;height:18px"')} Add bill</button></div>
    <div class="bar" style="margin-top:12px"><i style="width:${occ.length ? paid.length / occ.length * 100 : 0}%"></i></div>
    <p class="tiny muted" style="margin:10px 0 0">Tick a bill when it’s paid and it’s logged as spending for you. Autopay bills tick themselves on the due date.</p></section>
    <div class="seg"><button class="${UI.billsCal ? '' : 'on'}" data-a="billsView" data-v="0">List</button><button class="${UI.billsCal ? 'on' : ''}" data-a="billsView" data-v="1">Calendar</button></div>`;
  if (!S.bills.length) return head + `<section class="card"><div class="empty"><span class="big">🗓️</span>Add the bills you pay every month, week or year.<br>You only do this once.</div></section>`;
  if (UI.billsCal) return head + `<section class="card">${calendar(M)}</section>`;
  const paused = S.bills.filter(b => b.active === false);
  return head + `<section class="card"><ul class="list">${occ.map(o => billRow(o)).join('') || '<li class="empty">No bills fall in this month.</li>'}</ul></section>
    ${paused.length ? `<section class="card"><h2>Paused</h2><ul class="list">${paused.map(b => `<li class="li tap" data-a="editBill" data-id="${b.id}"><div class="ico">⏸️</div><div class="grow"><div class="name">${esc(b.name)}</div><div class="meta">${FREQS[b.freq] || ''}</div></div><div class="val">${money(b.amt)}</div></li>`).join('')}</ul></section>` : ''}`;
}
function calendar(M) {
  const [y, m] = M.split('-').map(Number), first = new Date(y, m - 1, 1).getDay(), dim = daysIn(y, m), t = todayISO();
  const ev = {};
  for (const o of billsInMonth(M)) (ev[o.d] = ev[o.d] || []).push(`<span class="ev st-${o.st}" title="${esc(o.b.name)}">${esc(o.b.name)}</span>`);
  for (const o of paysInMonth(M)) (ev[o.d] = ev[o.d] || []).push(`<span class="ev pay" title="${esc(o.p.name)}">💵 ${esc(o.p.name)}</span>`);
  let h = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(d => `<div class="h">${d}</div>`).join('');
  for (let i = 0; i < first; i++) h += '<div class="d x"></div>';
  for (let d = 1; d <= dim; d++) { const k = iso(y, m, d); h += `<div class="d ${k === t ? 't' : ''}"><b>${d}</b>${(ev[k] || []).join('')}</div>`; }
  return `<div class="cal">${h}</div><div class="legend" style="margin-top:12px"><span><i class="dot" style="background:var(--good)"></i>Paid / payday</span><span><i class="dot" style="background:var(--warn)"></i>Due soon</span><span><i class="dot" style="background:var(--bad)"></i>Overdue</span><span><i class="dot" style="background:var(--muted)"></i>Upcoming</span></div>`;
}

/* ---------------------------------------------------------------- budget */
function vBudget() {
  const M = UI.M, rows = budgetRows(M);
  const pIn = sum(rows.filter(r => r.c.group === 'Income'), r => r.planned), pOut = sum(rows.filter(r => r.c.group !== 'Income'), r => r.planned);
  const unassigned = pIn - pOut;
  let h = `<section class="card"><div class="tiles" style="margin-top:0"><div><div class="tiny muted"><b>PLANNED IN</b></div><div style="font-weight:900;font-size:1.15rem">${money(pIn, true)}</div></div>
    <div><div class="tiny muted"><b>PLANNED OUT</b></div><div style="font-weight:900;font-size:1.15rem">${money(pOut, true)}</div></div>
    <div><div class="tiny muted"><b>${unassigned >= 0 ? 'NOT PLANNED' : 'OVER-PLANNED'}</b></div><div style="font-weight:900;font-size:1.15rem" class="${unassigned < 0 ? 'bad' : unassigned > 0 ? 'warn' : 'good'}">${money(Math.abs(unassigned), true)}</div></div></div>
    <p class="tiny muted" style="margin:10px 0 0">${unassigned > 0 ? 'Give every dollar a job: add the rest to savings, debt or a category.' : unassigned < 0 ? 'Your plan spends more than your planned income. Trim a category or two.' : 'Every planned dollar has a job. 👌'} These are monthly amounts. Tap any category to change it.</p></section>`;
  for (const g of GROUPS) {
    const gr = rows.filter(r => r.c.group === g);
    const ga = sum(gr, r => r.actual), gp = sum(gr, r => r.planned);
    h += `<section class="card"><h2><span class="dot" style="background:var(--g-${g});width:12px;height:12px"></span>${g}<span class="sp"></span><span class="small" style="font-family:var(--sans)">${money(ga, true)} <span class="muted">/ ${money(gp, true)}</span></span></h2>
      <ul class="list">${gr.map(r => { const st = statusOf(r); return `<li class="li tap" data-a="editCat" data-id="${r.c.id}"><div class="ico">${esc(r.c.icon || '•')}</div>
      <div class="grow"><div class="between"><span class="name">${esc(r.c.name)}${isCouple() && r.c.owner !== 'shared' ? ` <span class="pill st-upcoming">${esc(pName(r.c.owner))}</span>` : ''}</span><span class="small num">${money(r.actual)} <span class="muted">/ ${money(r.planned, true)}</span></span></div>
      <div class="bar ${st}" style="margin-top:6px"><i style="width:${Math.min(100, r.planned > 0 ? r.actual / r.planned * 100 : (r.actual > 0 ? 100 : 0))}%"></i></div>
      <div class="tiny ${st === 'bad' ? 'bad' : 'muted'}" style="margin-top:3px">${g === 'Income' ? (r.actual >= r.planned ? 'Received' : `${money(r.planned - r.actual)} still to come`) : r.left >= 0 ? `${money(r.left)} left` : `${money(-r.left)} over`}</div></div></li>`; }).join('') || '<li class="empty small">No categories in this group.</li>'}</ul>
      <button class="btn sm ghost" style="margin-top:8px" data-a="addCat" data-g="${g}">${svg('plus', 'style="width:16px;height:16px"')} Add to ${g}</button></section>`;
  }
  return h;
}

/* ---------------------------------------------------------------- paychecks */
function vPaychecks() {
  const M = UI.M, pays = paysInMonth(M), bills = billsInMonth(M);
  let h = `<section class="card"><h2>Your paychecks<span class="sp"></span><button class="btn sm" data-a="addPay">${svg('plus', 'style="width:16px;height:16px"')} Add</button></h2>
    ${S.pays.length ? `<ul class="list">${S.pays.map(p => `<li class="li tap" data-a="editPay" data-id="${p.id}"><div class="ico">💵</div><div class="grow"><div class="name">${esc(p.name)}</div>
    <div class="meta">${PAYFREQS[p.freq]}${isCouple() ? ' · ' + esc(pName(p.who)) : ''}</div></div><div class="val">${money(p.amt)}</div></li>`).join('')}</ul>`
    : '<div class="empty">Add your take-home pay to see which paycheck covers which bill.</div>'}</section>`;
  if (!pays.length) return h;
  const groups = pays.map(o => ({ o, bills: [] })), early = [];
  for (const b of bills) { let gi = -1; for (let i = 0; i < pays.length; i++) if (pays[i].d <= b.d) gi = i; (gi < 0 ? early : groups[gi].bills).push(b); }
  const billLine = b => `<li class="li" style="padding:6px 2px"><span class="pill st-${b.st}">${STATUS_LABEL[b.st]}</span><div class="grow small"><b>${esc(b.b.name)}</b> <span class="muted">· ${shortDate(b.d)}</span></div><div class="val small">${money(b.b.amt)}</div></li>`;
  if (early.length) h += `<section class="card"><h2>Before your first payday</h2><p class="small muted" style="margin:0 0 6px">Paid from last month’s money.</p><ul class="list">${early.map(billLine).join('')}</ul>
    <div class="between" style="margin-top:6px"><b>Total</b><b>${money(sum(early, b => b.b.amt))}</b></div></section>`;
  for (const g of groups) {
    const left = g.o.p.amt - sum(g.bills, b => b.b.amt);
    h += `<section class="card"><h2>${shortDate(g.o.d)} · ${esc(g.o.p.name)}<span class="sp"></span>${g.o.logged ? '<span class="pill st-paid">Logged</span>' : g.o.d <= todayISO() ? `<button class="ci-btn" data-a="logPay" data-p="${g.o.p.id}" data-d="${g.o.d}">Log it</button>` : '<span class="pill st-upcoming">Coming</span>'}</h2>
      <div class="between"><span class="muted">Paycheck</span><b>${money(g.o.p.amt)}</b></div>
      ${g.bills.length ? `<ul class="list" style="margin-top:4px">${g.bills.map(billLine).join('')}</ul>` : '<p class="small muted">No bills due before the next paycheck.</p>'}
      <div class="between" style="border-top:1px solid var(--line);padding-top:8px;margin-top:4px"><b>Left from this paycheck</b><b class="${left < 0 ? 'bad' : 'good'}">${money(left)}</b></div></section>`;
  }
  return h + '<p class="tiny muted" style="text-align:center">Each bill is matched to the last paycheck on or before its due date.</p>';
}

/* ---------------------------------------------------------------- debt */
function vDebt() {
  const P = S.debtPlan, active = S.debts.filter(d => num(d.bal) > 0);
  let h = `<section class="card"><div class="seg" style="margin-bottom:10px"><button class="${P.strategy === 'avalanche' ? 'on' : ''}" data-a="strategy" data-s="avalanche">Avalanche</button><button class="${P.strategy === 'snowball' ? 'on' : ''}" data-a="strategy" data-s="snowball">Snowball</button></div>
    <p class="small muted" style="margin:0 0 10px">${P.strategy === 'snowball' ? 'Snowball pays the smallest balance first. Quick wins keep you going.' : 'Avalanche pays the highest interest rate first. It usually costs the least.'}</p>
    <label class="f"><span>Extra on top of minimums, each month</span><input class="in" inputmode="decimal" data-c="extra" value="${num(P.extra) || ''}" placeholder="0"></label></section>`;
  if (!active.length) return h + `<section class="card"><div class="empty"><span class="big">🎈</span>${S.debts.length ? 'Every debt is paid off. Amazing.' : 'Add a credit card, loan or other debt to see your debt-free date.'}<br>
    <button class="btn sm" style="margin-top:10px" data-a="addDebt">Add a debt</button></div></section>${debtList()}`;
  const sim = simulateDebts(S.debts, P.strategy, P.extra, false), base = simulateDebts(S.debts, P.strategy, 0, true);
  const total = sum(active, d => d.bal);
  h += `<section class="card hero"><div class="ring"></div><div class="lab">Debt-free in</div>
    <div class="big" style="font-size:clamp(2rem,9vw,2.8rem)">${sim.stuck ? 'Not yet in reach' : monthLabel(addMonthsKey(sim.startM, sim.months - 1))}</div>
    <div class="sub">${sim.stuck ? 'At these payments some debt keeps growing. Add a little extra or check the minimums.' : `${plural(sim.months, 'month')} · ${money(sim.budget)} a month in total`}</div>
    <div class="tiles"><div class="tile"><div class="t">Owed now</div><div class="v">${money(total, true)}</div></div>
    <div class="tile"><div class="t">Interest</div><div class="v">${sim.stuck ? '—' : money(sim.totalInt, true)}</div></div>
    <div class="tile"><div class="t">Saved vs min.</div><div class="v">${sim.stuck || base.stuck ? '—' : money(Math.max(0, base.totalInt - sim.totalInt), true)}</div></div></div></section>`;

  return h + debtList() + `<p class="tiny muted" style="text-align:center">Estimates only. Your lender’s numbers may differ. Not financial advice.</p>`;
}
function debtList() {

  return `<section class="card"><h2>Your debts<span class="sp"></span><button class="btn sm" data-a="addDebt">${svg('plus', 'style="width:16px;height:16px"')} Add</button></h2>
    ${S.debts.map(d => { const pi = promoInfo(d); return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="between"><b>${esc(d.name)}</b><b>${money(d.bal)}</b></div>
    <div class="small muted">${num(d.apr)}% APR · minimum ${money(d.min)}${d.promoEnd ? ` · ${num(d.promoApr)}% promo until ${shortDate(d.promoEnd)} ${d.promoEnd.slice(0, 4)}` : ''}</div>
    ${pi && !pi.ended ? `<div class="banner info" style="margin:8px 0 0;padding:10px 12px"><div class="small"><b>Promo countdown: ${plural(pi.left, 'payment')} left.</b> Pay ${money(pi.need)} a month to clear it before the rate jumps to ${num(d.apr)}%.</div></div>` : ''}
    ${pi && pi.ended ? `<div class="small warn" style="margin-top:4px"><b>Promo has ended.</b> The full rate applies now.</div>` : ''}
    <div class="btns" style="margin-top:8px"><button class="btn sm alt" data-a="debtPay" data-id="${d.id}">Log a payment</button><button class="btn sm ghost" data-a="editDebt" data-id="${d.id}">Edit</button></div></div>`; }).join('')}</section>`;
}

/* ---------------------------------------------------------------- goals */
function vGoals() {
  const cards = S.goals.map(g => { const gi = goalInfo(g); return `<section class="card"><div class="row"><div class="ico">${esc(g.icon || '🎯')}</div><div class="grow"><div style="font-weight:900;font-size:1.15rem">${esc(g.name)}</div>

  const cards = G.people.map(p => {

    const note = pi.budget > 0 && pi.spent > pi.budget ? `<span class="bad">${money(pi.spent - pi.budget)} over</span>`
      : pi.toBuy ? `${pi.budget ? money(pi.left) + ' left · ' : ''}${pi.toBuy} to buy${pi.est ? `, about ${money(pi.est)}` : ''}`
      : pi.count ? `All bought ✓${pi.budget ? ' · ' + money(pi.left) + ' left' : ''}` : 'No gift ideas yet';
    return `<section class="card"><h2>${esc(p.name)}<span class="sp"></span><span class="small" style="font-family:var(--sans)">${money(pi.spent, true)} <span class="muted">/ ${money(pi.budget, true)}</span></span>
      <button class="link" data-a="editPerson" data-id="${p.id}" aria-label="Edit ${esc(p.name)}">Edit</button></h2>

function giftSheet(p, g, buyNow) {

    <label class="f"><span>Date</span><input class="in" type="date" id="f_bdate" value="${t?.date || todayISO()}"></label></div>

    () => {
      const idea = $('#f_name').value.trim(); if (!idea) return toast('Type the gift idea');

    <div class="tiles" style="grid-template-columns:1fr 1fr"><div class="tile"><div class="t">You own</div><div class="v">${money(nw.assets, true)}</div></div><div class="tile"><div class="t">You owe</div><div class="v">${money(nw.liabilities, true)}</div></div></div></section>

    <section class="card"><h2>What you own<span class="sp"></span><button class="btn sm" data-a="addAcct" data-k="asset">${svg('plus', 'style="width:16px;height:16px"')} Add</button></h2>

    <ul class="list">${accts.filter(a => a.kind !== 'asset').map(line).join('')}${S.nw.incDebts ? S.debts.filter(d => num(d.bal) > 0).map(d => `<li class="li"><div class="ico">📉</div><div class="grow"><div class="name">${esc(d.name)}</div><div class="meta">from Debt payoff</div></div><div class="val bad">−${money(d.bal)}</div></li>`).join('') : ''}</ul>
    <div class="toggle"><span class="small"><b>Include debts from Debt payoff</b></span><button class="sw ${S.nw.incDebts ? 'on' : ''}" data-a="incDebts" aria-pressed="${S.nw.incDebts}" aria-label="Include debts"></button></div></section>
    <p class="tiny muted" style="text-align:center">Update your balances once a month. Each month’s total is saved for the chart.</p>`;

function lineChart(hist) {
  const W = 600, H = 200, P = 34, vals = hist.map(h => h[1]), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const pts = hist.map((h, i) => [P + i * (W - 2 * P) / Math.max(1, hist.length - 1), H - P - (h[1] - lo) / span * (H - 2 * P)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net worth by month"><path d="${d} L${pts[pts.length - 1][0]} ${H - P} L${pts[0][0]} ${H - P} Z" fill="var(--acc-soft)"/>
    <path d="${d}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--acc)"/>`).join('')}
    ${hist.map((h, i) => `<text x="${pts[i][0]}" y="${H - 10}" text-anchor="middle">${MON[Number(h[0].slice(5)) - 1]}</text>`).join('')}
    <text x="${pts[pts.length - 1][0]}" y="${pts[pts.length - 1][1] - 10}" text-anchor="end" class="amt">${esc(fmtMoney(vals[vals.length - 1], true))}</text></svg>`;
}

/* ---------------------------------------------------------------- year */
function vYear() {
  const Y = UI.Y, ms = Array.from({ length: 12 }, (_, i) => `${Y}-${pad(i + 1)}`), tots = ms.map(monthTotals);
  const tin = sum(tots, t => t.inc), tout = sum(tots, t => t.spent), tsav = sum(tots, t => t.saved);
  const max = Math.max(1, ...tots.map(t => Math.max(t.inc, t.spent, t.saved)));
  const W = 640, H = 220, P = 26, bw = (W - 2 * P) / 12;
  const bars = tots.map((t, i) => { const x = P + i * bw, s = v => (v / max) * (H - 2 * P);
    return `<rect x="${x + 4}" y="${H - P - s(t.inc)}" width="${bw / 3 - 3}" height="${s(t.inc)}" rx="3" fill="var(--g-Income)"/>
    <rect x="${x + 4 + bw / 3 - 2}" y="${H - P - s(t.spent)}" width="${bw / 3 - 3}" height="${s(t.spent)}" rx="3" fill="var(--g-Wants)"/>
    <rect x="${x + 4 + 2 * (bw / 3 - 2)}" y="${H - P - s(t.saved)}" width="${bw / 3 - 3}" height="${s(t.saved)}" rx="3" fill="var(--g-Savings)"/>
    <text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${MON[i]}</text>`; }).join('');
  const rows = S.cats.filter(c => c.group !== 'Income').map(c => ({ c, a: sum(ms, M => catActual(c, M)), p: num(c.budget) * 12 })).filter(r => r.a || r.p).sort((a, b) => b.a - a.a);
  return `<div class="monthbar"><button data-a="year" data-d="-1" aria-label="Previous year">‹</button><b>${Y}</b><button data-a="year" data-d="1" aria-label="Next year">›</button></div>
    <section class="card"><div class="tiles" style="margin-top:0"><div><div class="tiny muted"><b>MONEY IN</b></div><div style="font-weight:900;font-size:1.15rem">${money(tin, true)}</div></div>
    <div><div class="tiny muted"><b>SPENT</b></div><div style="font-weight:900;font-size:1.15rem">${money(tout, true)}</div></div><div><div class="tiny muted"><b>SAVED</b></div><div style="font-weight:900;font-size:1.15rem">${money(tsav, true)}</div></div></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:12px" role="img" aria-label="Money in, spent and saved by month">${bars}</svg>
    <div class="legend"><span><i class="dot" style="background:var(--g-Income)"></i>Money in</span><span><i class="dot" style="background:var(--g-Wants)"></i>Spent</span><span><i class="dot" style="background:var(--g-Savings)"></i>Saved</span></div></section>
    <section class="card"><h2>By category</h2><ul class="list">${rows.map(r => `<li class="li"><div class="ico">${esc(r.c.icon || '•')}</div><div class="grow"><div class="name">${esc(r.c.name)}</div><div class="meta">${r.c.group} · plan ${money(r.p, true)}</div></div>
    <div class="val ${r.p > 0 && r.a > r.p ? 'bad' : ''}">${money(r.a, true)}</div></li>`).join('') || '<li class="empty">Nothing logged this year.</li>'}</ul></section>
    <div class="btns"><button class="btn alt" data-a="print">Print or save as PDF</button></div>`;
}

function obCollect() {
  const s = S.settings;
  if ($('#ob_p1')) s.p1 = $('#ob_p1').value.trim();
  if ($('#ob_p2')) s.p2 = $('#ob_p2').value.trim();
  if ($('#ob_cur')) { s.currency = $('#ob_cur').value; _fmt = {}; }
  $$('[data-ob-name]').forEach(i => { const c = cat(i.dataset.obName); if (c) c.name = i.value.trim() || c.name; });
  $$('[data-ob-budget]').forEach(i => { const c = cat(i.dataset.obBudget); if (c) c.budget = parseAmt(i.value); });
}
function obCollectBills() {
  $$('[data-ob-bamt]').forEach(i => {
    const id = i.dataset.obBamt, amt = parseAmt(i.value), day = clamp(Math.round(num($(`[data-ob-bday="${id}"]`).value)) || 1, 1, 31);
    let b = S.bills.find(x => x.cat === id);
    if (amt > 0) {
      if (!b) { b = { id: uid(), name: catName(id), cat: id, freq: 'monthly', start: todayISO(), autopay: false, who: 'joint', paid: {}, created: todayISO(), active: true }; S.bills.push(b); }
      b.amt = amt; b.day = day;
      const c = cat(id); if (c && !num(c.budget)) c.budget = amt;
    } else if (b) S.bills = S.bills.filter(x => x !== b);
  });
}
function obCollectPay() {
  const amt = parseAmt($('#ob_pamt')?.value);
  if (amt <= 0) return;
  const freq = $('#ob_pfreq').value, d = $('#ob_pdate').value || todayISO();
  const inc = S.cats.find(c => c.group === 'Income');
  let p = S.pays[0];
  if (!p) { p = { id: uid(), logged: {} }; S.pays.push(p); }
  Object.assign(p, { name: S.settings.p1 ? `${S.settings.p1}’s paycheck` : 'Paycheck', amt, freq, start: d, day1: freq === 'semimonthly' ? 1 : parseISO(d).getDate(), day2: 15, who: 'p1', cat: inc?.id });
  if (inc && !num(inc.budget)) inc.budget = round2(amt * ({ weekly: 52, biweekly: 26, semimonthly: 24, monthly: 12 }[freq]) / 12);
}

/* ---------------------------------------------------------------- sheets */
function openSheet(html, onSave) {
  const open = $('#sheet');
  if (open && open.classList.contains('on')) { const top = open.scrollTop; open.innerHTML = `<div class="grab"></div>${html}`; open.scrollTop = top; UI.sheetSave = onSave || null; return; }
  closeSheet(true);
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.id = 'scrim'; scrim.dataset.a = 'closeSheet';
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.id = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-modal', 'true');
  sh.innerHTML = `<div class="grab"></div>${html}`;
  document.body.append(scrim, sh);
  UI.sheetSave = onSave || null;
  requestAnimationFrame(() => { scrim.classList.add('on'); sh.classList.add('on'); const f = sh.querySelector('[autofocus]'); if (f && !IS_IOS) f.focus(); });
}
function closeSheet(instant) {
  const sh = $('#sheet'), sc = $('#scrim');
  if (!sh) return;
  UI.sheetSave = null;
  if (instant) { sh.remove(); sc?.remove(); return; }
  sh.classList.remove('on'); sc?.classList.remove('on');
  setTimeout(() => { sh.remove(); sc?.remove(); }, 220);
}
const sheetHead = (t, x = '') => `<h3>${t}<span class="sp"></span>${x}<button class="iconbtn" data-a="closeSheet" aria-label="Close">✕</button></h3>`;
const whoSeg = (cur, field = 'who') => isCouple() ? `<label class="f"><span>Who paid?</span><div class="seg" data-seg="${field}">${['p1', 'p2', 'joint'].map(w => `<button type="button" class="${cur === w ? 'on' : ''}" data-a="seg" data-v="${w}">${esc(pName(w))}</button>`).join('')}</div></label>` : '';
const segVal = (field, sh = $('#sheet')) => $(`[data-seg="${field}"] .on`, sh)?.dataset.v;
const catOptions = (sel, groups) => GROUPS.filter(g => !groups || groups.includes(g)).map(g => `<optgroup label="${g}">${S.cats.filter(c => c.group === g).map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.icon || '')} ${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
function defaultDate() { const t = todayISO(); if (monthOf(t) === UI.M) return t; const [y, m] = UI.M.split('-').map(Number); return UI.M < monthOf(t) ? iso(y, m, daysIn(y, m)) : iso(y, m, 1); }

function openTx(t) {

function updateAfter() {

  const amt = parseAmt($('#f_amt')?.value), ty = segVal('type') || 'out', M = monthOf($('#f_date')?.value || todayISO());

/* ---------------------------------------------------------------- backup / restore */
async function doBackup() {
  const data = JSON.stringify({ app: 'inkling-budget', v: 1, exported: new Date().toISOString(), state: S }, null, 1);
  const name = `inkling-budget-backup-${todayISO()}.json`;
  const blob = new Blob([data], { type: 'application/json' });
  let done = false;
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if ((IS_IOS || IS_ANDROID) && navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: 'Inkling Budget backup' }); done = true; }
  } catch (e) { if (e?.name === 'AbortError') return; }
  if (!done) downloadBlob(blob, name);
  S.settings.lastBackup = todayISO(); save(); render();
  toast('Backup saved. Keep the file somewhere safe.');
}
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function pickRestore() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let d; try { d = JSON.parse(r.result); } catch (e) { return toast('That file isn’t an Inkling Budget backup'); }
      const st = d?.state || d;
      if (!st || st.app !== 'inkling-budget' || !Array.isArray(st.tx)) return toast('That file isn’t an Inkling Budget backup');
      openSheet(`${sheetHead('Restore this backup?')}<p>Backup from <b>${d.exported ? longDate(d.exported.slice(0, 10)) : 'an unknown date'}</b> with ${plural(st.tx.length, 'entry')}, ${plural((st.bills || []).length, 'bill')} and ${plural((st.goals || []).length, 'goal')}.</p>
        <div class="banner"><div class="small">This replaces everything on this device. If you’re not sure, make a backup of what’s here first.</div></div>
        <div class="btns"><button class="btn" data-a="sheetSave">Restore</button><button class="btn alt" data-a="closeSheet">Cancel</button></div>`,
        () => { const snap = snapshot(); S = migrate(st); S.settings.onboarded = true; _fmt = {}; closeSheet(); commit({ nw: false }); undoable('Backup restored', snap); });
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ---------------------------------------------------------------- toast */
let toastTimer;
function toast(msg, undo) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="toastUndo">Undo</button>' : ''}`;
  if (undo) $('#toastUndo').onclick = () => { t.classList.remove('on'); undo(); };
  t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), undo ? 6000 : 2600);
}

  addBill: () => billSheet(null),
  editBill: el => billSheet(S.bills.find(b => b.id === el.dataset.id)),
  delBill: el => { const snap = snapshot(), b = S.bills.find(x => x.id === el.dataset.id); S.bills = S.bills.filter(x => x !== b); closeSheet(); commit(); undoable('Bill deleted (past entries kept)', snap); },
  addCat: el => catSheet(null, el.dataset.g),
  editCat: el => catSheet(cat(el.dataset.id)),
  delCat: el => {
    const id = el.dataset.id, to = $('#f_moveto')?.value, snap = snapshot();
    if (S.goals.some(g => g.cat === id)) return toast('A savings goal uses this category. Delete the goal instead.');
    for (const t of S.tx) if (t.cat === id) t.cat = to;
    for (const b of S.bills) if (b.cat === id) b.cat = to || S.cats.find(c => c.id !== id && c.group === 'Bills')?.id;
    for (const p of S.pays) if (p.cat === id) p.cat = to || S.cats.find(c => c.id !== id && c.group === 'Income')?.id;
    for (const d of S.debts) if (d.cat === id) d.cat = null;
    if (S.gifts.cat === id) S.gifts.cat = to || null;
    S.cats = S.cats.filter(c => c.id !== id); closeSheet(); commit(); undoable('Category deleted', snap);
  },
  addPay: () => paySheet(null),
  editPay: el => paySheet(S.pays.find(p => p.id === el.dataset.id)),
  delPay: el => { const snap = snapshot(); S.pays = S.pays.filter(p => p.id !== el.dataset.id); closeSheet(); commit(); undoable('Paycheck deleted (logged entries kept)', snap); },
  strategy: el => { S.debtPlan.strategy = el.dataset.s; commit(); },
  addDebt: () => debtSheet(null),
  editDebt: el => debtSheet(S.debts.find(d => d.id === el.dataset.id)),
  delDebt: el => { const snap = snapshot(); S.debts = S.debts.filter(d => d.id !== el.dataset.id); closeSheet(); commit(); undoable('Debt deleted', snap); },
  debtPay: el => debtPaySheet(S.debts.find(d => d.id === el.dataset.id)),
  addGoal: () => goalSheet(null),
  editGoal: el => goalSheet(S.goals.find(g => g.id === el.dataset.id)),
  goalAdd: el => goalAddSheet(S.goals.find(g => g.id === el.dataset.id)),
  delGoal: el => { const snap = snapshot(), g = S.goals.find(x => x.id === el.dataset.id); S.goals = S.goals.filter(x => x !== g);
    if (g && !S.tx.some(t => t.cat === g.cat)) S.cats = S.cats.filter(c => c.id !== g.cat);
    closeSheet(); commit(); undoable('Goal deleted (its savings entries are kept)', snap); },
  addPerson: () => personSheet(null),
  editPerson: el => personSheet(findPerson(el.dataset.id)),
  delPerson: el => { const snap = snapshot(), p = findPerson(el.dataset.id); S.gifts.people = S.gifts.people.filter(x => x !== p); closeSheet(); commit(); undoable(`${p ? p.name : 'Person'} removed (spending kept)`, snap); },
  addGift: el => giftSheet(findPerson(el.dataset.p), null),
  editGift: el => { const p = findPerson(el.dataset.p); giftSheet(p, p?.gifts.find(g => g.id === el.dataset.g)); },
  delGift: el => { const snap = snapshot(), p = findPerson(el.dataset.p); if (p) p.gifts = p.gifts.filter(g => g.id !== el.dataset.g); closeSheet(); commit(); undoable('Gift idea deleted (spending kept)', snap); },
  buyGift: el => {
    const p = findPerson(el.dataset.p), g = p?.gifts.find(x => x.id === el.dataset.g); if (!g) return;
    if (num(g.price) <= 0) return giftSheet(p, g, true);
    const snap = snapshot(); buyGift(p, g, num(g.price), todayISO(), 'joint'); commit(); askPersist();
    undoable(`Bought · ${fmtMoney(num(g.price))} logged`, snap);
  },
  unbuyGift: el => { const p = findPerson(el.dataset.p), g = p?.gifts.find(x => x.id === el.dataset.g); if (!g) return; const snap = snapshot(); unbuyGift(g); commit(); undoable(`${g.idea} marked not bought`, snap); },
  giftListEdit: () => giftListSheet(),
  giftSeason: () => openSheet(`${sheetHead('Start a new list?')}<p>Keeps your people and their budgets and clears every gift idea. What you already spent stays on the Spending screen.${S.gifts.date ? ' The date moves on a year if it has passed.' : ''}</p>
    <div class="btns"><button class="btn" data-a="sheetSave">Start new list</button><button class="btn alt" data-a="closeSheet">Cancel</button></div>`,
    () => { const snap = snapshot(); newGiftSeason(); closeSheet(); commit(); undoable('New gift list started', snap); }),
  addAcct: el => acctSheet(null, el.dataset.k),
  editAcct: el => acctSheet(S.nw.accts.find(a => a.id === el.dataset.id)),
  delAcct: el => { const snap = snapshot(); S.nw.accts = S.nw.accts.filter(a => a.id !== el.dataset.id); closeSheet(); commit(); undoable('Deleted', snap); },
  incDebts: () => { S.nw.incDebts = !S.nw.incDebts; commit(); },
  settle: () => settleSheet(null),
  mode: el => { S.settings.mode = el.dataset.m; commit(); },
  theme: el => { S.settings.theme = el.dataset.t; save(); render(); },
  accent: el => { S.settings.accent = el.dataset.k; save(); render(); },
  backup: () => doBackup(),
  restore: () => pickRestore(),
  csv: () => { downloadBlob(new Blob(['﻿' + txCSV()], { type: 'text/csv' }), `inkling-budget-entries-${todayISO()}.csv`); toast('CSV saved'); },
  print: () => window.print(),
  install: () => installSheet(),
  doInstall: async () => { const d = UI.deferred; if (!d) return; closeSheet(); d.prompt(); try { await d.userChoice; } catch (e) { } UI.deferred = null; render(); },
  snoozeInstall: () => { S.settings.installSnooze = addDays(todayISO(), 3); save(); render(); },
  loadSample: () => openSheet(`${sheetHead('Load sample numbers?')}<p>This replaces everything on this device with a made-up couple’s budget.</p><div class="btns"><button class="btn" data-a="sheetSave">Load samples</button><button class="btn alt" data-a="closeSheet">Cancel</button></div>`,
    () => { const snap = snapshot(), keep = { theme: S.settings.theme, accent: S.settings.accent, currency: S.settings.currency, lastBackup: S.settings.lastBackup }; S = sampleState(); Object.assign(S.settings, keep); closeSheet(); UI.M = monthOf(todayISO()); commit(); undoable('Sample numbers loaded', snap); }),
  startFresh: () => openSheet(`${sheetHead('Start your own budget?')}<p>This clears Sam and Jordan’s sample numbers and walks you through setup.</p><div class="btns"><button class="btn" data-a="sheetSave">Clear and set up</button><button class="btn alt" data-a="closeSheet">Cancel</button></div>`,
    () => { const keep = { theme: S.settings.theme, accent: S.settings.accent, lastBackup: S.settings.lastBackup }; S = blankState(); Object.assign(S.settings, keep); closeSheet(); UI.ob = 1; save(); render(); }),
  erase: () => openSheet(`${sheetHead('Erase everything?')}<p>All entries, bills, goals and settings on this device will be deleted. Backup files you saved aren’t touched.</p>
    <label class="row small" style="margin:10px 0 16px"><input type="checkbox" id="f_sure" style="width:22px;height:22px"> I understand this can’t be undone</label>
    <div class="btns"><button class="btn danger" data-a="sheetSave">Erase</button><button class="btn alt" data-a="closeSheet">Cancel</button></div>`,
    () => { if (!$('#f_sure').checked) return toast('Tick the box to confirm'); S = blankState(); UI.ob = 0; UI.route = 'home'; closeSheet(); save(); render(); toast('Everything erased'); }),
  // onboarding
  ob: el => {
    if (el.dataset.save) { obCollect(); if (UI.ob === 3) obCollectBills(); if (UI.ob === 4) obCollectPay(); }
    else if (Number(el.dataset.s) < UI.ob) obCollect();
    UI.ob = Number(el.dataset.s); save(); render();
  },
  obMode: el => { obCollect(); S.settings.mode = el.dataset.m; render(); },
  obSample: () => { S = sampleState(); UI.M = monthOf(todayISO()); save(); render(); },
  obDelCat: el => { obCollect(); S.cats = S.cats.filter(c => c.id !== el.dataset.id); render(); },
  obAddCat: el => { obCollect(); S.cats.push({ id: uid(), name: 'New category', group: el.dataset.g, budget: 0, icon: '⭐', owner: 'shared' }); render(); const ins = $$('[data-ob-name]'); ins.filter(i => i.value === 'New category').pop()?.select(); },
  obDone: () => { S.settings.onboarded = true; S.settings.created = S.settings.created || todayISO(); UI.route = 'home'; UI.M = monthOf(todayISO()); save(); askPersist(); render(); }
};
/* settings inputs (change) and live inputs */
const CHG = {
  p1: el => { S.settings.p1 = el.value.trim(); save(); },
  p2: el => { S.settings.p2 = el.value.trim(); save(); },
  split: el => { S.settings.split = el.value; commit(); },
  customP1: el => { S.settings.customP1 = clamp(num(el.value), 0, 100); save(); },
  currency: el => { S.settings.currency = el.value; _fmt = {}; commit(); },
  extra: el => { S.debtPlan.extra = parseAmt(el.value); commit(); },
  billFreq: el => { $('#f_when').innerHTML = billWhen(el.value, null); },
  payFreq: el => { $('#f_when').innerHTML = payWhen(el.value, null); }
};

/* ---------------------------------------------------------------- boot */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'A') return;
  const a = el.dataset.a; if (!ACT[a]) return;
  e.preventDefault(); ACT[a](el, e);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-c]'); if (el && CHG[el.dataset.c]) CHG[el.dataset.c](el); if (e.target.id === 'f_date') updateAfter(); });
document.addEventListener('input', e => {
  if (e.target.id === 'f_amt') updateAfter();
  if (e.target.dataset?.c === 'txQ') { UI.txQ = e.target.value; const pos = e.target.selectionStart; render(); const i = $('[data-c=txQ]'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch (er) { } } }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet')) closeSheet();
  if (e.key === 'Enter' && $('#sheet') && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); UI.sheetSave?.(); }
});
ACT.txF = el => { UI.txF = el.dataset.f; render(); };
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); UI.deferred = e; if (S.settings.onboarded) render(); });
window.addEventListener('appinstalled', () => { UI.deferred = null; toast('Installed 🎉'); });
window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.settings.theme === 'auto') applyTheme(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.settings.onboarded) { const n = runAutopay(); if (n) { save(); } render(); } });

loadState();
if (S.settings.onboarded && runAutopay()) save();
if (S.settings.onboarded && !IS_DEMO) { snapNetWorth(); save(); }
render();
if (BUILD.sw && 'serviceWorker' in navigator && !IS_FILE) navigator.serviceWorker.register('sw.js').catch(() => { });

</script>
</body>
</html>
